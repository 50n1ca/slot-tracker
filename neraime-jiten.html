<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>狙い目辞典</title>
<style>
:root{
  --paper:#E4E2DB;
  --paper-hi:#F1EFE9;
  --ink:#16161A;
  --ink-mid:#4A4842;
  --ink-soft:#7C796F;
  --rule:#C6C3B9;
  --spot-1:#D4004E;
  --spot-2:#0B3FC7;
  --spot-3:#0A7A4B;
  --marker:#F3E64A;
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","BIZ UDPGothic",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,"Hiragino Kaku Gothic ProN",monospace;
  --rail:34px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.7;
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--spot-2);outline-offset:2px}

/* ---------- header ---------- */
.hdr{
  position:sticky;top:0;z-index:30;
  background:var(--paper);
  border-bottom:1.5px solid var(--ink);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 0;
}
.hdr-row{display:flex;align-items:baseline;gap:10px}
.wordmark{
  font-size:23px;font-weight:800;letter-spacing:-.045em;line-height:1;margin:0;
}
.wordmark .dot{color:var(--spot-1)}
.eyebrow{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;
  color:var(--ink-soft);text-transform:uppercase;margin-left:auto;
}
.searchbar{display:flex;gap:8px;padding:10px 0 9px;align-items:center}
.searchbar input[type=search]{
  flex:1;min-width:0;background:var(--paper-hi);
  border:1.5px solid var(--ink);border-radius:0;
  padding:9px 11px;font-size:16px;
  appearance:none;-webkit-appearance:none;
}
.searchbar input[type=search]::placeholder{color:var(--ink-soft)}
.chip{
  border:1.5px solid var(--ink);padding:8px 11px;font-size:13px;font-weight:700;
  background:var(--paper-hi);white-space:nowrap;
}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.chip.add{background:var(--spot-1);color:#fff;border-color:var(--spot-1)}
.count{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink-soft);
  padding-bottom:7px;
}

/* ---------- list ---------- */
main{padding:0 var(--rail) 120px 0}
.rowhead{
  position:sticky;top:0;z-index:5;
  display:flex;align-items:center;gap:9px;
  background:var(--paper);
  padding:13px 0 5px 14px;
  border-bottom:1px solid var(--rule);
}
.rowhead b{font-size:17px;font-weight:800;letter-spacing:.02em}
.rowhead span{font-family:var(--mono);font-size:9.5px;color:var(--ink-soft);letter-spacing:.14em}
.item{
  display:block;width:100%;text-align:left;
  padding:11px 14px 12px;
  border-bottom:1px solid var(--rule);
}
.item:active{background:var(--paper-hi)}
.item-top{display:flex;align-items:flex-start;gap:8px}
.item-name{font-size:16.5px;font-weight:800;letter-spacing:-.02em;line-height:1.35;flex:1}
.star{font-size:15px;line-height:1.4;color:var(--rule)}
.star.on{color:var(--spot-1)}
.item-meta{
  display:flex;flex-wrap:wrap;gap:5px 6px;margin-top:6px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-mid);
}
.tag{border:1px solid var(--rule);padding:1.5px 5px}
.tag.tenjo{border-color:var(--ink);font-weight:700}
.filled{display:flex;gap:3px;margin-top:7px}
.pip{width:15px;height:3px;background:var(--rule)}
.pip.p1.on{background:var(--spot-1)}
.pip.p2.on{background:var(--spot-2)}
.pip.p3.on{background:var(--spot-3)}
.pip.p4.on{background:var(--ink)}
.empty{padding:60px 20px;text-align:center;color:var(--ink-soft);font-size:14px;line-height:2}

/* ---------- kana rail (signature) ---------- */
.rail{
  position:fixed;top:0;right:0;bottom:0;width:var(--rail);z-index:20;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  gap:1px;background:var(--paper);border-left:1.5px solid var(--ink);
  padding:calc(env(safe-area-inset-top) + 76px) 0 calc(env(safe-area-inset-bottom) + 8px);
  user-select:none;
}
.rail button{
  writing-mode:vertical-rl;
  font-size:12.5px;font-weight:700;letter-spacing:.06em;
  color:var(--ink-soft);
  flex:1;width:100%;
  display:flex;align-items:center;justify-content:center;
}
.rail button.has{color:var(--ink);background:var(--paper-hi)}
.rail button.has:active{background:var(--ink);color:var(--paper)}

/* ---------- sheet ---------- */
.sheet{
  position:fixed;inset:0;z-index:50;background:var(--paper);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateY(14px);opacity:0;pointer-events:none;
  transition:transform .22s cubic-bezier(.2,.8,.3,1),opacity .18s;
  padding-bottom:calc(env(safe-area-inset-bottom) + 60px);
}
.sheet.open{transform:none;opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet-bar{
  position:sticky;top:0;z-index:2;background:var(--paper);
  border-bottom:1.5px solid var(--ink);
  display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 9px) 14px 9px;
}
.sheet-bar .back{font-size:14px;font-weight:700}
.sheet-bar .right{margin-left:auto;display:flex;gap:8px}
.sheet-bar .txtbtn{font-size:13.5px;font-weight:700;padding:6px 9px;border:1.5px solid var(--ink)}
.sheet-bar .txtbtn.primary{background:var(--ink);color:var(--paper)}
.sheet-bar .txtbtn.danger{border-color:var(--spot-1);color:var(--spot-1)}

.title-block{padding:18px 16px 14px;border-bottom:1.5px solid var(--ink)}
.title-block h1{
  font-size:27px;font-weight:800;letter-spacing:-.045em;line-height:1.22;margin:0;
}
.title-block .yomi{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--ink-soft);margin-top:7px;
}
.spec{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.spec .tag{font-family:var(--mono);font-size:11px;padding:3px 7px}

.sec{border-bottom:1px solid var(--rule);padding:0 16px 20px}
.sec-head{
  display:flex;align-items:center;gap:9px;
  padding:16px 0 10px;position:relative;
}
.num{
  width:23px;height:23px;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12px;font-weight:700;color:#fff;
}
.s1 .num{background:var(--spot-1)}
.s2 .num{background:var(--spot-2)}
.s3 .num{background:var(--spot-3)}
.s4 .num{background:var(--ink)}
.sec-head h2{font-size:15px;font-weight:800;letter-spacing:.01em;margin:0}
.body{white-space:pre-wrap;font-size:15px;line-height:1.85;word-break:break-word}
.body mark{background:linear-gradient(transparent 58%,var(--marker) 58%);color:inherit;padding:0 1px}
.blank{color:var(--ink-soft);font-size:13.5px}

/* ---------- edit form ---------- */
.form{padding:4px 16px 40px}
.field{margin-top:16px}
.field label{
  display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  color:var(--ink-soft);margin-bottom:5px;
}
.field label b{font-family:var(--sans);font-size:12.5px;letter-spacing:0;color:var(--ink)}
.field input,.field textarea{
  width:100%;background:var(--paper-hi);border:1.5px solid var(--ink);border-radius:0;
  padding:9px 10px;font-size:16px;line-height:1.7;appearance:none;-webkit-appearance:none;
}
.field textarea{min-height:120px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.6}
.marker-ex{background:linear-gradient(transparent 58%,var(--marker) 58%)}

/* ---------- data footer ---------- */
.datazone{
  border-top:1.5px solid var(--ink);margin-top:28px;padding:16px 14px 40px;
}
.datazone h3{font-size:12.5px;font-weight:800;margin:0 0 4px;letter-spacing:.02em}
.datazone p{font-size:12px;color:var(--ink-soft);margin:0 0 11px;line-height:1.7}
.datazone .btns{display:flex;gap:8px;flex-wrap:wrap}
.datazone .chip{font-size:12.5px}
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);
  transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:var(--paper);font-size:13px;font-weight:700;
  padding:10px 16px;z-index:99;opacity:0;pointer-events:none;transition:.18s;
  max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-row">
    <h1 class="wordmark">狙い目辞典<span class="dot">.</span></h1>
    <div class="eyebrow">slot index</div>
  </div>
  <div class="searchbar">
    <input type="search" id="q" placeholder="機種名・本文を検索" autocomplete="off" autocorrect="off">
    <button class="chip" id="favBtn" aria-pressed="false">★のみ</button>
    <button class="chip add" id="addBtn">＋</button>
  </div>
  <div class="count" id="count"></div>
</header>

<nav class="rail" id="rail" aria-label="五十音インデックス"></nav>

<main id="list"></main>

<section class="datazone">
  <h3>データの持ち出し</h3>
  <p>登録内容はこの端末のブラウザに保存されます。機種変更やGitHub Pagesへの再配置の前に、JSONで書き出しておくと安全です。</p>
  <div class="btns">
    <button class="chip" id="exportBtn">JSONを書き出す</button>
    <button class="chip" id="importBtn">JSONを読み込む</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
</section>

<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ---------- storage (localStorage が使えない環境ではメモリに退避) ---------- */
var KEY="neraime-jiten-v1";
var mem=null, canPersist=true;
try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }catch(e){ canPersist=false; }
function load(){
  if(!canPersist) return mem;
  try{ var r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ return null; }
}
function save(){
  mem=data;
  if(!canPersist) return;
  try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){ toast("保存できませんでした。JSONで書き出してください"); }
}

/* ---------- sections ---------- */
var SECTIONS=[
  {k:"neraime", n:"①", cls:"s1", t:"狙い目・ハイエナポイント", ph:"例：\u3010500G\u3011からゾーン狙い可。CZ後の即やめ台は{...}"},
  {k:"zencho",  n:"②", cls:"s2", t:"前兆の起こり方でのモード推測", ph:"例：短い前兆が連続 → 高モード示唆。ガセ前兆の出方で{...}"},
  {k:"shisa",   n:"③", cls:"s3", t:"設定示唆・モード示唆の確認ポイント", ph:"例：終了画面（キャラ別の示唆内容）／通常時のアイキャッチ／{...}"},
  {k:"other",   n:"④", cls:"s4", t:"その他の押さえどころ", ph:"例：打ち方のミス、ペナルティ、有利区間ランプの位置、やめどき{...}"}
];

/* ---------- kana rows ---------- */
var ROWS=[
  {l:"あ",c:"アイウエオァィゥェォヴ"},
  {l:"か",c:"カキクケコガギグゲゴヵヶ"},
  {l:"さ",c:"サシスセソザジズゼゾ"},
  {l:"た",c:"タチツテトダヂヅデドッ"},
  {l:"な",c:"ナニヌネノ"},
  {l:"は",c:"ハヒフヘホバビブベボパピプペポ"},
  {l:"ま",c:"マミムメモ"},
  {l:"や",c:"ヤユヨャュョ"},
  {l:"ら",c:"ラリルレロ"},
  {l:"わ",c:"ワヲンヮ"},
  {l:"他",c:""}
];
function toKata(s){
  return String(s||"").replace(/[\u3041-\u3096]/g,function(ch){
    return String.fromCharCode(ch.charCodeAt(0)+0x60);
  });
}
function sortKey(m){
  var s=toKata(m.yomi||m.name||"").replace(/[\s・ー'"\u3000]/g,"");
  return s;
}
function rowOf(m){
  var k=sortKey(m).charAt(0);
  for(var i=0;i<ROWS.length-1;i++){ if(ROWS[i].c.indexOf(k)>=0) return ROWS[i].l; }
  return "他";
}

/* ---------- data ---------- */
var data=load();
if(!data){
  data={items:[
    {id:"sample1",name:"サンプル機種A（書き換えてください）",yomi:"サンプルキシュエー",
     maker:"",type:"AT",tenjo:"",fav:false,
     neraime:"ここに狙い目を書きます。\n\n【 】で囲むと蛍光マーカーが付きます → 【天井狙いは600Gから】\n\n・ゾーン狙い：\n・天井狙い：\n・CZ/AT後の高確狙い：\n・やめどき：",
     zencho:"・前兆の長さと当たりの関係：\n・ガセ前兆の出方で分かること：\n・高モード示唆となる挙動：",
     shisa:"・終了画面：\n・通常時のアイキャッチ：\n・液晶のキャラ/背景：\n・小役確率やボーナス比率：",
     other:"・打ち方の注意（ペナルティ、目押し）：\n・有利区間ランプの位置：\n・据え置き/リセット判別：",
     updated:Date.now()}
  ]};
  save();
}
function uid(){ return "m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function find(id){ for(var i=0;i<data.items.length;i++) if(data.items[i].id===id) return data.items[i]; return null; }

/* ---------- helpers ---------- */
var $=function(s){ return document.querySelector(s); };
var listEl=$("#list"), railEl=$("#rail"), sheetEl=$("#sheet"), toastEl=$("#toast"), countEl=$("#count");
var query="", favOnly=false, tId=null;

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function rich(s){ return esc(s).replace(/【([^】]*)】/g,"<mark>$1</mark>"); }
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add("show");
  clearTimeout(tId); tId=setTimeout(function(){ toastEl.classList.remove("show"); },1900);
}
function matches(m){
  if(favOnly && !m.fav) return false;
  if(!query) return true;
  var q=toKata(query).toLowerCase();
  var hay=toKata([m.name,m.yomi,m.maker,m.type,m.tenjo,m.neraime,m.zencho,m.shisa,m.other].join(" ")).toLowerCase();
  return hay.indexOf(q)>=0;
}
function sorted(){
  var a=data.items.filter(matches);
  a.sort(function(x,y){
    var rx=ROWS.findIndex(function(r){return r.l===rowOf(x);});
    var ry=ROWS.findIndex(function(r){return r.l===rowOf(y);});
    if(rx!==ry) return rx-ry;
    return sortKey(x).localeCompare(sortKey(y),"ja");
  });
  return a;
}

/* ---------- render list ---------- */
function renderList(){
  var items=sorted(), html="", cur=null, present={};
  items.forEach(function(m){
    var r=rowOf(m); present[r]=true;
    if(r!==cur){
      cur=r;
      html+='<div class="rowhead" id="row-'+r+'"><b>'+r+'</b><span>'+r.toUpperCase()+'</span></div>';
    }
    var meta="";
    if(m.maker) meta+='<span class="tag">'+esc(m.maker)+'</span>';
    if(m.type)  meta+='<span class="tag">'+esc(m.type)+'</span>';
    if(m.tenjo) meta+='<span class="tag tenjo">天井 '+esc(m.tenjo)+'</span>';
    var pips="";
    SECTIONS.forEach(function(s,i){
      pips+='<i class="pip p'+(i+1)+((m[s.k]||"").trim()?" on":"")+'"></i>';
    });
    html+='<button class="item" data-id="'+m.id+'">'
        +   '<div class="item-top"><div class="item-name">'+esc(m.name)+'</div>'
        +   '<div class="star'+(m.fav?" on":"")+'">'+(m.fav?"★":"☆")+'</div></div>'
        +   (meta?'<div class="item-meta">'+meta+'</div>':"")
        +   '<div class="filled">'+pips+'</div>'
        + '</button>';
  });
  listEl.innerHTML = html || '<div class="empty">'+(data.items.length?"条件に合う機種がありません。":"まだ機種がありません。<br>右上の＋から追加してください。")+'</div>';
  countEl.textContent = items.length+" / "+data.items.length+" 機種"+(canPersist?"":"　※この環境では保存されません");
  renderRail(present);
}
function renderRail(present){
  var h="";
  ROWS.forEach(function(r){ h+='<button class="'+(present[r.l]?"has":"")+'" data-row="'+r.l+'">'+r.l+'</button>'; });
  railEl.innerHTML=h;
}

/* ---------- detail ---------- */
function openDetail(id){
  var m=find(id); if(!m) return;
  var secs="";
  SECTIONS.forEach(function(s){
    var v=(m[s.k]||"").trim();
    secs+='<section class="sec '+s.cls+'">'
        +   '<div class="sec-head"><div class="num">'+s.n.replace(/[①②③④]/,function(c){return {"①":"1","②":"2","③":"3","④":"4"}[c];})+'</div><h2>'+s.t+'</h2></div>'
        +   (v?'<div class="body">'+rich(v)+'</div>':'<div class="blank">未記入</div>')
        + '</section>';
  });
  var spec="";
  if(m.maker) spec+='<span class="tag">'+esc(m.maker)+'</span>';
  if(m.type)  spec+='<span class="tag">'+esc(m.type)+'</span>';
  if(m.tenjo) spec+='<span class="tag tenjo">天井 '+esc(m.tenjo)+'</span>';

  sheetEl.innerHTML=
    '<div class="sheet-bar">'
    + '<button class="back" data-act="close">← 一覧</button>'
    + '<div class="right">'
    +   '<button class="txtbtn" data-act="fav">'+(m.fav?"★ お気に入り":"☆ お気に入り")+'</button>'
    +   '<button class="txtbtn primary" data-act="edit">編集</button>'
    + '</div></div>'
    + '<div class="title-block"><h1>'+esc(m.name)+'</h1>'
    +   (m.yomi?'<div class="yomi">'+esc(toKata(m.yomi))+'</div>':"")
    +   (spec?'<div class="spec">'+spec+'</div>':"")
    + '</div>'
    + secs;
  sheetEl.dataset.id=id;
  sheetEl.classList.add("open");
  sheetEl.scrollTop=0;
}

/* ---------- edit ---------- */
function openEdit(id){
  var m=id?find(id):{id:"",name:"",yomi:"",maker:"",type:"",tenjo:"",fav:false,neraime:"",zencho:"",shisa:"",other:""};
  var fields="";
  SECTIONS.forEach(function(s){
    fields+='<div class="field"><label>'+s.n+' <b>'+s.t+'</b></label>'
          + '<textarea data-k="'+s.k+'" placeholder="'+esc(s.ph)+'">'+esc(m[s.k]||"")+'</textarea></div>';
  });
  sheetEl.innerHTML=
    '<div class="sheet-bar">'
    + '<button class="back" data-act="cancel">← 取消</button>'
    + '<div class="right">'
    +   (id?'<button class="txtbtn danger" data-act="delete">削除</button>':"")
    +   '<button class="txtbtn primary" data-act="save">保存</button>'
    + '</div></div>'
    + '<div class="form">'
    +   '<div class="field"><label><b>機種名</b></label><input data-k="name" value="'+esc(m.name)+'" placeholder="例：スマスロ〇〇"></div>'
    +   '<div class="field"><label><b>よみ（五十音順に使います）</b></label><input data-k="yomi" value="'+esc(m.yomi)+'" placeholder="例：スマスロマルマル"></div>'
    +   '<div class="grid2">'
    +     '<div class="field"><label><b>メーカー</b></label><input data-k="maker" value="'+esc(m.maker)+'"></div>'
    +     '<div class="field"><label><b>タイプ</b></label><input data-k="type" value="'+esc(m.type)+'" placeholder="AT / ノーマル 等"></div>'
    +   '</div>'
    +   '<div class="field"><label><b>天井</b></label><input data-k="tenjo" value="'+esc(m.tenjo)+'" placeholder="例：999G / CZ非当選5回"></div>'
    +   fields
    +   '<div class="hint">本文を【 】で囲むと<span class="marker-ex">蛍光マーカー</span>が付きます。改行はそのまま反映されます。</div>'
    + '</div>';
  sheetEl.dataset.id=id||"";
  sheetEl.dataset.mode="edit";
  sheetEl.classList.add("open");
  sheetEl.scrollTop=0;
  var f=sheetEl.querySelector('[data-k=name]'); if(!id&&f) f.focus();
}
function collect(){
  var o={};
  sheetEl.querySelectorAll("[data-k]").forEach(function(el){ o[el.dataset.k]=el.value; });
  return o;
}

/* ---------- events ---------- */
listEl.addEventListener("click",function(e){
  var b=e.target.closest(".item"); if(b) openDetail(b.dataset.id);
});
railEl.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  var t=document.getElementById("row-"+b.dataset.row);
  if(t) t.scrollIntoView({behavior:"smooth",block:"start"});
  else toast("「"+b.dataset.row+"」の機種はまだありません");
});
sheetEl.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]"); if(!b) return;
  var act=b.dataset.act, id=sheetEl.dataset.id;
  if(act==="close"||act==="cancel"){ close(); }
  else if(act==="edit"){ openEdit(id); }
  else if(act==="fav"){
    var m=find(id); if(m){ m.fav=!m.fav; save(); openDetail(id); renderList(); }
  }
  else if(act==="save"){
    var v=collect();
    if(!(v.name||"").trim()){ toast("機種名を入力してください"); return; }
    if(id){
      var m2=find(id); Object.keys(v).forEach(function(k){ m2[k]=v[k]; }); m2.updated=Date.now();
    }else{
      v.id=uid(); v.fav=false; v.updated=Date.now(); data.items.push(v); id=v.id;
    }
    save(); renderList(); sheetEl.dataset.mode=""; openDetail(id); toast("保存しました");
  }
  else if(act==="delete"){
    if(confirm("この機種を削除します。元に戻せません。")){
      data.items=data.items.filter(function(x){ return x.id!==id; });
      save(); renderList(); close(); toast("削除しました");
    }
  }
});
function close(){ sheetEl.classList.remove("open"); sheetEl.dataset.mode=""; setTimeout(function(){ if(!sheetEl.classList.contains("open")) sheetEl.innerHTML=""; },240); }

$("#q").addEventListener("input",function(e){ query=e.target.value.trim(); renderList(); });
$("#favBtn").addEventListener("click",function(e){
  favOnly=!favOnly; e.currentTarget.setAttribute("aria-pressed",favOnly?"true":"false"); renderList();
});
$("#addBtn").addEventListener("click",function(){ openEdit(""); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape") close(); });

$("#exportBtn").addEventListener("click",function(){
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="neraime-jiten-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
});
$("#importBtn").addEventListener("click",function(){ $("#importFile").click(); });
$("#importFile").addEventListener("change",function(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var j=JSON.parse(r.result);
      if(!j||!Array.isArray(j.items)) throw 0;
      if(!confirm("読み込むと現在の内容は置き換わります。続けますか？")) return;
      data=j; save(); renderList(); toast("読み込みました（"+j.items.length+"機種）");
    }catch(err){ toast("読み込めませんでした。ファイル形式を確認してください"); }
  };
  r.readAsText(f);
  e.target.value="";
});

renderList();
})();
</script>
</body>
</html>
