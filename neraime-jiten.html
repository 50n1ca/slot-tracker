<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>狙い目辞典</title>
<style>
:root{
  --paper:#E4E2DB; --paper-hi:#F1EFE9;
  --ink:#16161A; --ink-mid:#4A4842; --ink-soft:#7C796F; --rule:#C6C3B9;
  --spot-1:#D4004E; --spot-2:#0B3FC7; --spot-3:#0A7A4B; --spot-4:#6A1FB0;
  --marker:#F3E64A;
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,"Hiragino Kaku Gothic ProN",monospace;
  --rail:34px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--spot-2);outline-offset:2px}

.hdr{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1.5px solid var(--ink);padding:calc(env(safe-area-inset-top) + 10px) 14px 0}
.hdr-row{display:flex;align-items:baseline;gap:10px}
.wordmark{font-size:23px;font-weight:800;letter-spacing:-.045em;line-height:1;margin:0}
.wordmark .dot{color:var(--spot-1)}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--ink-soft);text-transform:uppercase;margin-left:auto}
.searchbar{display:flex;gap:8px;padding:10px 0 9px;align-items:center}
.searchbar input[type=search]{flex:1;min-width:0;background:var(--paper-hi);border:1.5px solid var(--ink);border-radius:0;padding:9px 11px;font-size:16px;appearance:none;-webkit-appearance:none}
.chip{border:1.5px solid var(--ink);padding:8px 11px;font-size:13px;font-weight:700;background:var(--paper-hi);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.chip.add{background:var(--spot-1);color:#fff;border-color:var(--spot-1)}
.count{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink-soft);padding-bottom:7px}

main{padding:0 var(--rail) 100px 0}
.rowhead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:9px;background:var(--paper);padding:13px 0 5px 14px;border-bottom:1px solid var(--rule)}
.rowhead b{font-size:17px;font-weight:800}
.item{display:block;width:100%;text-align:left;padding:11px 14px 12px;border-bottom:1px solid var(--rule)}
.item:active{background:var(--paper-hi)}
.item-top{display:flex;align-items:flex-start;gap:8px}
.item-name{font-size:16.5px;font-weight:800;letter-spacing:-.02em;line-height:1.35;flex:1}
.star{font-size:15px;color:var(--rule)} .star.on{color:var(--spot-1)}
.item-meta{display:flex;flex-wrap:wrap;gap:5px 6px;margin-top:6px;font-family:var(--mono);font-size:10.5px;color:var(--ink-mid)}
.tag{border:1px solid var(--rule);padding:1.5px 5px}
.tag.tenjo{border-color:var(--ink);font-weight:700}
.filled{display:flex;gap:3px;margin-top:7px}
.pip{width:15px;height:3px;background:var(--rule)}
.pip.p1.on{background:var(--spot-1)}.pip.p2.on{background:var(--spot-2)}.pip.p3.on{background:var(--spot-3)}.pip.p4.on{background:var(--spot-4)}.pip.p5.on{background:var(--ink)}
.hit{margin-top:7px;border-left:3px solid var(--spot-2);padding-left:8px;font-size:12.5px;color:var(--ink-mid);line-height:1.6}
.empty{padding:60px 20px;text-align:center;color:var(--ink-soft);font-size:14px;line-height:2}

.rail{position:fixed;top:0;right:0;bottom:0;width:var(--rail);z-index:20;display:flex;flex-direction:column;gap:1px;background:var(--paper);border-left:1.5px solid var(--ink);padding:calc(env(safe-area-inset-top) + 76px) 0 calc(env(safe-area-inset-bottom) + 8px);user-select:none}
.rail button{writing-mode:vertical-rl;font-size:12.5px;font-weight:700;color:var(--ink-soft);flex:1;width:100%;display:flex;align-items:center;justify-content:center}
.rail button.has{color:var(--ink);background:var(--paper-hi)}
.rail button.has:active{background:var(--ink);color:var(--paper)}

.sheet{position:fixed;inset:0;z-index:50;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(14px);opacity:0;pointer-events:none;transition:transform .22s cubic-bezier(.2,.8,.3,1),opacity .18s;padding-bottom:calc(env(safe-area-inset-bottom) + 60px)}
.sheet.open{transform:none;opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet-bar{position:sticky;top:0;z-index:3;background:var(--paper);border-bottom:1.5px solid var(--ink);display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 9px) 14px 9px}
.sheet-bar .back{font-size:14px;font-weight:700}
.sheet-bar .right{margin-left:auto;display:flex;gap:8px}
.txtbtn{font-size:13.5px;font-weight:700;padding:6px 9px;border:1.5px solid var(--ink)}
.txtbtn.primary{background:var(--ink);color:var(--paper)}
.txtbtn.danger{border-color:var(--spot-1);color:var(--spot-1)}

.title-block{padding:18px 16px 14px;border-bottom:1.5px solid var(--ink)}
.title-block h1{font-size:27px;font-weight:800;letter-spacing:-.045em;line-height:1.22;margin:0}
.title-block .yomi{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--ink-soft);margin-top:7px}
.spec{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.spec .tag{font-family:var(--mono);font-size:11px;padding:3px 7px}

.tenjobox{margin-top:14px;border-top:1.5px solid var(--ink);padding-top:8px}
.tenjobox h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--ink-soft);margin:0 0 4px;font-weight:400}
.trow{display:flex;gap:9px;align-items:baseline;padding:4px 0;border-bottom:1px dotted var(--rule)}
.tgroup{margin-top:10px}
.tgroup:first-of-type{margin-top:4px}
.tgroup h4{display:flex;align-items:center;gap:6px;font-family:var(--sans);font-size:11.5px;font-weight:800;letter-spacing:0;color:var(--ink);margin:0 0 3px}
.trow .st{font-family:var(--mono);font-size:9px;font-weight:700;color:#fff;padding:1px 4px;flex:none}
.st{font-family:var(--mono);font-size:9px;font-weight:700;color:#fff;padding:1px 4px;flex:none;letter-spacing:.04em}
.st-reset{background:var(--spot-1)}
.st-normal{background:var(--ink-mid)}
.tag.t-reset{border-color:var(--spot-1);color:var(--spot-1);font-weight:700}
.trow .tk{font-size:12.5px;font-weight:700;flex:none}
.trow .tg{font-family:var(--mono);font-size:14px;font-weight:700}
.trow .tb{font-size:12px;color:var(--ink-mid);flex:1;text-align:right;min-width:0}

.sec{border-bottom:1px solid var(--rule);padding:0 16px 20px}
.sec-head{display:flex;align-items:center;gap:9px;padding:16px 0 10px}
.num{width:23px;height:23px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:700;color:#fff}
.s1 .num{background:var(--spot-1)}.s2 .num{background:var(--spot-2)}.s3 .num{background:var(--spot-3)}.s4 .num{background:var(--spot-4)}.s5 .num{background:var(--ink)}
.sec-head h2{font-size:15px;font-weight:800;margin:0}
.body{white-space:pre-wrap;font-size:15px;line-height:1.85;word-break:break-word}
.body mark{background:linear-gradient(transparent 58%,var(--marker) 58%);padding:0 1px}
.blank{color:var(--ink-soft);font-size:13.5px}

.bgroup{margin-top:14px}
.bgroup:first-child{margin-top:0}
.bgroup h3{font-size:13.5px;font-weight:800;margin:0 0 6px;padding-bottom:4px;border-bottom:1.5px solid var(--ink)}
.brow{display:flex;gap:9px;align-items:baseline;padding:6px 0;border-bottom:1px dotted var(--rule)}
.brow .bl{font-size:13px;font-weight:700;flex:1;min-width:0}
.brow .bv{font-family:var(--mono);font-size:14px;font-weight:700;white-space:nowrap}
.brow .bu{font-size:11.5px;color:var(--ink-mid);white-space:nowrap}
.bnote{font-size:12px;color:var(--ink-mid);padding:5px 0;line-height:1.6}

.yfilter{width:100%;background:var(--paper-hi);border:1.5px solid var(--rule);padding:7px 9px;font-size:16px;margin-bottom:8px;appearance:none;-webkit-appearance:none}
.yrow{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dotted var(--rule)}
.ymain{flex:1;min-width:0}
.ykind{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink-soft);display:block}
.ytrig{font-size:14.5px;font-weight:700;line-height:1.45;word-break:break-word;display:block}
.ynote{font-size:11.5px;color:var(--ink-soft);line-height:1.5;display:block}
.act{flex:none;font-size:11px;font-weight:700;color:#fff;padding:3px 7px;white-space:normal;max-width:38vw;text-align:center;line-height:1.4}
.a-stop{background:var(--ink)}.a-heaven{background:var(--spot-3)}.a-cz{background:var(--spot-2)}.a-at{background:var(--spot-1)}.a-other{background:var(--ink-soft)}

.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;padding:7px 0;border-bottom:1px dotted var(--rule);font-size:14.5px;line-height:1.6}
.steps li:before{content:counter(s);font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;background:var(--spot-3);width:19px;height:19px;flex:none;display:flex;align-items:center;justify-content:center;margin-top:3px}

.links a{display:block;font-size:14px;font-weight:700;color:var(--spot-2);padding:5px 0;word-break:break-all}
.links .nourl{display:block;font-size:14px;padding:5px 0;color:var(--ink-mid)}

.form{padding:4px 16px 40px}
.field{margin-top:16px}
.field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink-soft);margin-bottom:5px}
.field label b{font-family:var(--sans);font-size:12.5px;letter-spacing:0;color:var(--ink)}
.field input,.field textarea,.field select{width:100%;background:var(--paper-hi);border:1.5px solid var(--ink);border-radius:0;padding:9px 10px;font-size:16px;line-height:1.7;appearance:none;-webkit-appearance:none}
.field textarea{min-height:110px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--ink-soft);margin-top:10px;line-height:1.6}
.marker-ex{background:linear-gradient(transparent 58%,var(--marker) 58%)}
.editrow{border:1.5px solid var(--rule);padding:10px;margin-top:9px;background:var(--paper-hi);overflow:hidden}
.editrow .field{margin-top:9px}
.editrow .rm{float:right;font-size:12px;font-weight:700;color:var(--spot-1);padding:2px 6px;border:1px solid var(--spot-1)}
.addrow{margin-top:10px;border:1.5px dashed var(--ink);padding:9px;width:100%;font-size:13px;font-weight:700;text-align:center}
.subhead{margin-top:28px;padding-bottom:5px;border-bottom:1.5px solid var(--ink);font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.subhead .num{width:20px;height:20px;font-size:11px}

.datazone{border-top:1.5px solid var(--ink);margin-top:28px;padding:16px 14px 40px}
.datazone h3{font-size:12.5px;font-weight:800;margin:0 0 4px}
.datazone p{font-size:12px;color:var(--ink-soft);margin:0 0 11px;line-height:1.7}
.datazone .btns{display:flex;gap:8px;flex-wrap:wrap}
.datazone .chip{font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--paper);font-size:13px;font-weight:700;padding:10px 16px;z-index:99;opacity:0;pointer-events:none;transition:.18s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-row">
    <h1 class="wordmark">狙い目辞典<span class="dot">.</span></h1>
    <div class="eyebrow">slot index</div>
  </div>
  <div class="searchbar">
    <input type="search" id="q" placeholder="機種名・終了画面・アイキャッチ" autocomplete="off" autocorrect="off">
    <button class="chip" id="favBtn" aria-pressed="false">★のみ</button>
    <button class="chip add" id="addBtn">＋</button>
  </div>
  <div class="count" id="count"></div>
</header>

<nav class="rail" id="rail" aria-label="五十音インデックス"></nav>
<main id="list"></main>

<section class="datazone">
  <h3>データの持ち出し</h3>
  <p>登録内容はこの端末のブラウザにだけ残ります。機種変更や再配置の前にJSONで書き出しておいてください。</p>
  <div class="btns">
    <button class="chip" id="exportBtn">JSONを書き出す</button>
    <button class="chip" id="importBtn">JSONを読み込む</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
</section>

<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

var KEY="neraime-jiten-v2", OLDKEY="neraime-jiten-v1";
var canPersist=true, mem=null;
try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }catch(e){ canPersist=false; }

var ACTIONS=[
  {k:"stop",  t:"即ヤメ",           c:"a-stop"},
  {k:"heaven",t:"天国確認(100G+α)", c:"a-heaven"},
  {k:"cz",    t:"CZ当選まで",       c:"a-cz"},
  {k:"at",    t:"AT当選まで",       c:"a-at"},
  {k:"other", t:"その他",           c:"a-other"}
];
var KINDS=["終了画面","アイキャッチ","1枚絵","セリフ","ランプ","履歴","その他"];
var TENJO_KINDS=["通常天井","CZ間天井","AT間天井","その他"];
var TENJO_STATES=[
  {k:"normal", t:"通常",     s:"通常", c:"st-normal"},
  {k:"reset",  t:"リセット", s:"リセ", c:"st-reset"}
];
function stateOf(k){ return (k==="reset")?TENJO_STATES[1]:TENJO_STATES[0]; }
function shortKind(k){ return String(k||"").replace(/天井$/,"")||"天井"; }
function kindLabel(o){
  return (o.kind==="その他" && (o.kindOther||"").trim()) ? o.kindOther.trim() : (o.kind||"");
}
function actOf(k){ for(var i=0;i<ACTIONS.length;i++) if(ACTIONS[i].k===k) return ACTIONS[i]; return ACTIONS[4]; }

var ROWS=[
  {l:"あ",c:"アイウエオァィゥェォヴ"},{l:"か",c:"カキクケコガギグゲゴヵヶ"},
  {l:"さ",c:"サシスセソザジズゼゾ"},{l:"た",c:"タチツテトダヂヅデドッ"},
  {l:"な",c:"ナニヌネノ"},{l:"は",c:"ハヒフヘホバビブベボパピプペポ"},
  {l:"ま",c:"マミムメモ"},{l:"や",c:"ヤユヨャュョ"},{l:"ら",c:"ラリルレロ"},
  {l:"わ",c:"ワヲンヮ"},{l:"他",c:""}
];
function toKata(s){ return String(s||"").replace(/[\u3041-\u3096]/g,function(ch){ return String.fromCharCode(ch.charCodeAt(0)+0x60); }); }
function sortKey(m){ return toKata(m.yomi||m.name||"").replace(/[\s\u3000・ー]/g,""); }
function rowOf(m){ var k=sortKey(m).charAt(0);
  for(var i=0;i<ROWS.length-1;i++) if(ROWS[i].c.indexOf(k)>=0) return ROWS[i].l;
  return "他"; }

function blank(){ return {id:"",name:"",yomi:"",maker:"",type:"",tenjos:[],fav:false,
  borders:[],neraimeMemo:"",yamedoki:[],yamedokiMemo:"",steps:[],mode:"",other:"",links:[],updated:0}; }
function normalize(m){
  if(typeof m.tenjo==="string" && m.tenjo.trim() && !Array.isArray(m.tenjos))
    m.tenjos=[{kind:"通常天井",games:m.tenjo,benefit:"",note:""}];
  delete m.tenjo;
  var b=blank();
  for(var k in b){ if(m[k]===undefined) m[k]=b[k]; }
  ["borders","yamedoki","steps","links","tenjos"].forEach(function(kk){ if(!Array.isArray(m[kk])) m[kk]=[]; });
  m.tenjos.forEach(function(t){ if(t.state!=="reset") t.state="normal"; });
  return m;
}

function load(){
  if(!canPersist) return mem;
  try{
    var r=localStorage.getItem(KEY);
    if(r) return JSON.parse(r);
    var o=localStorage.getItem(OLDKEY);
    if(o){
      var old=JSON.parse(o), out={items:[]};
      (old.items||[]).forEach(function(m){
        var n=normalize({id:m.id,name:m.name,yomi:m.yomi,maker:m.maker,type:m.type,tenjo:m.tenjo,fav:!!m.fav});
        n.neraimeMemo=m.neraime||""; n.yamedokiMemo=m.shisa||"";
        n.mode=m.zencho||""; n.other=m.other||""; n.updated=m.updated||Date.now();
        out.items.push(n);
      });
      return out;
    }
  }catch(e){}
  return null;
}
var data=load();
if(!data) data={items:[]};
data.items=(data.items||[]).map(normalize);

function save(){ mem=data; if(!canPersist) return;
  try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){ toast("保存できません。JSONで書き出してください"); } }
save();

function uid(){ return "m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function find(id){ for(var i=0;i<data.items.length;i++) if(data.items[i].id===id) return data.items[i]; return null; }

var $=function(s){ return document.querySelector(s); };
var listEl=$("#list"), railEl=$("#rail"), sheetEl=$("#sheet"), toastEl=$("#toast"), countEl=$("#count");
var query="", favOnly=false, tId=null, draft=null;

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function rich(s){ return esc(s).replace(/【([^】]*)】/g,"<mark>$1</mark>"); }
function toast(m){ toastEl.textContent=m; toastEl.classList.add("show"); clearTimeout(tId);
  tId=setTimeout(function(){ toastEl.classList.remove("show"); },1900); }

function haystack(m){
  var a=[m.name,m.yomi,m.maker,m.type,m.neraimeMemo,m.yamedokiMemo,m.mode,m.other];
  m.tenjos.forEach(function(t){ a.push(kindLabel(t),stateOf(t.state).t,stateOf(t.state).s,t.games,t.benefit,t.note); });
  m.borders.forEach(function(b){ a.push(b.group,b.label,b.from,b.until,b.note); });
  m.yamedoki.forEach(function(y){ a.push(kindLabel(y),y.trigger,y.note,actOf(y.action).t,y.actionText); });
  m.steps.forEach(function(s){ a.push(s); });
  m.links.forEach(function(l){ a.push(l.label); });
  return toKata(a.join(" ")).toLowerCase();
}
function matches(m){
  if(favOnly && !m.fav) return false;
  if(!query) return true;
  return haystack(m).indexOf(toKata(query).toLowerCase())>=0;
}
function hitsIn(m){
  if(!query) return [];
  var q=toKata(query).toLowerCase(), out=[];
  m.yamedoki.forEach(function(y){
    if(out.length>=2) return;
    if(toKata([kindLabel(y),y.trigger,y.note].join(" ")).toLowerCase().indexOf(q)>=0){
      out.push(kindLabel(y)+"「"+y.trigger+"」→ "+(y.action==="other"?(y.actionText||"その他"):actOf(y.action).t));
    }
  });
  return out;
}
function sorted(){
  var a=data.items.filter(matches);
  a.sort(function(x,y){
    var rx=-1,ry=-1,i;
    for(i=0;i<ROWS.length;i++){ if(ROWS[i].l===rowOf(x)) rx=i; if(ROWS[i].l===rowOf(y)) ry=i; }
    if(rx!==ry) return rx-ry;
    return sortKey(x).localeCompare(sortKey(y),"ja");
  });
  return a;
}

function renderList(){
  var items=sorted(), html="", cur=null, present={};
  items.forEach(function(m){
    var r=rowOf(m); present[r]=true;
    if(r!==cur){ cur=r; html+='<div class="rowhead" id="row-'+r+'"><b>'+r+'</b></div>'; }
    var meta="";
    if(m.maker) meta+='<span class="tag">'+esc(m.maker)+'</span>';
    if(m.type)  meta+='<span class="tag">'+esc(m.type)+'</span>';
    m.tenjos.forEach(function(t){
      if(t.games){
        var st=stateOf(t.state), isR=(st.k==="reset");
        meta+='<span class="tag tenjo'+(isR?" t-reset":"")+'">'+(isR?"リセ ":"")+esc(shortKind(kindLabel(t)))+' '+esc(t.games)+'</span>';
      }
    });
    if(m.yamedoki.length) meta+='<span class="tag">早見表 '+m.yamedoki.length+'</span>';
    var on=[m.borders.length||m.neraimeMemo, m.yamedoki.length||m.yamedokiMemo, m.steps.length, m.mode, m.other];
    var pips="",i;
    for(i=0;i<5;i++) pips+='<i class="pip p'+(i+1)+(on[i]?" on":"")+'"></i>';
    var hits=hitsIn(m).map(function(h){ return '<div class="hit">'+esc(h)+'</div>'; }).join("");
    html+='<button class="item" data-id="'+m.id+'"><div class="item-top"><div class="item-name">'+esc(m.name)+'</div>'
        + '<div class="star'+(m.fav?" on":"")+'">'+(m.fav?"★":"☆")+'</div></div>'
        + (meta?'<div class="item-meta">'+meta+'</div>':"")
        + '<div class="filled">'+pips+'</div>'+hits+'</button>';
  });
  listEl.innerHTML=html||'<div class="empty">'+(data.items.length?"条件に合う機種がありません。":"まだ機種がありません。<br>右上の＋から追加してください。")+'</div>';
  countEl.textContent=items.length+" / "+data.items.length+" 機種"+(canPersist?"":"　※この環境では保存されません");
  var h=""; ROWS.forEach(function(r){ h+='<button class="'+(present[r.l]?"has":"")+'" data-row="'+r.l+'">'+r.l+'</button>'; });
  railEl.innerHTML=h;
}

function sec(cls,num,title,inner){
  return '<section class="sec '+cls+'"><div class="sec-head"><div class="num">'+num+'</div><h2>'+title+'</h2></div>'+inner+'</section>';
}
function tenjoBlock(rows,st){
  if(!rows.length) return "";
  return '<div class="tgroup"><h4 class="'+st.c+'-h"><span class="st '+st.c+'">'+st.s+'</span>'+(st.k==="reset"?"リセット時":"通常時")+'</h4>'
    + rows.map(function(t){
        return '<div class="trow"><span class="tk">'+esc(kindLabel(t))+'</span>'
             + '<span class="tg">'+esc(t.games||"")+'</span>'
             + '<span class="tb">'+(t.benefit?'→ '+esc(t.benefit):"")+'</span></div>'
             + (t.note?'<div class="bnote">'+rich(t.note)+'</div>':"");
      }).join("")+'</div>';
}
function tenjoHTML(m){
  var rows=m.tenjos.filter(function(t){ return (t.games||t.benefit||t.note); });
  if(!rows.length) return "";
  var nor=rows.filter(function(t){ return t.state!=="reset"; });
  var res=rows.filter(function(t){ return t.state==="reset"; });
  return '<div class="tenjobox"><h4>TENJO</h4>'+tenjoBlock(nor,TENJO_STATES[0])+tenjoBlock(res,TENJO_STATES[1])+'</div>';
}
function bordersHTML(m){
  if(!m.borders.length && !m.neraimeMemo) return '<div class="blank">未記入</div>';
  var html="", cur=null, open=false;
  m.borders.forEach(function(b){
    var g=b.group||"";
    if(g!==cur){
      cur=g;
      if(open) html+='</div>';
      html+='<div class="bgroup">'+(g?'<h3>'+esc(g)+'</h3>':'');
      open=true;
    }
    if(!b.from && !b.until){ html+='<div class="bnote">※ '+rich(b.note||"")+'</div>'; return; }
    html+='<div class="brow"><span class="bl">'+esc(b.label||"")+'</span>'
        + '<span class="bv">'+esc(b.from||"")+'</span><span class="bu">→ '+esc(b.until||"")+'</span></div>'
        + (b.note?'<div class="bnote">'+rich(b.note)+'</div>':"");
  });
  if(open) html+='</div>';
  if(m.neraimeMemo) html+='<div class="body" style="margin-top:14px">'+rich(m.neraimeMemo)+'</div>';
  return html;
}
function yameHTML(m){
  if(!m.yamedoki.length && !m.yamedokiMemo) return '<div class="blank">未記入</div>';
  var html="";
  if(m.yamedoki.length>=8) html+='<input type="search" class="yfilter" id="yfilter" placeholder="早見表を絞り込む" autocomplete="off">';
  html+='<div id="ylist">';
  m.yamedoki.forEach(function(y){
    var a=actOf(y.action), t=(y.action==="other"?(y.actionText||"その他"):a.t);
    html+='<div class="yrow" data-t="'+esc(toKata([kindLabel(y),y.trigger,y.note,t].join(" ")).toLowerCase())+'">'
        + '<div class="ymain"><span class="ykind">'+esc(kindLabel(y))+'</span>'
        + '<span class="ytrig">'+rich(y.trigger||"")+'</span>'
        + (y.note?'<span class="ynote">'+esc(y.note)+'</span>':"")+'</div>'
        + '<span class="act '+a.c+'">'+esc(t)+'</span></div>';
  });
  html+='</div>';
  if(m.yamedokiMemo) html+='<div class="body" style="margin-top:14px">'+rich(m.yamedokiMemo)+'</div>';
  return html;
}
function openDetail(id){
  var m=find(id); if(!m) return;
  var spec="";
  if(m.maker) spec+='<span class="tag">'+esc(m.maker)+'</span>';
  if(m.type)  spec+='<span class="tag">'+esc(m.type)+'</span>';

  var steps=m.steps.length
    ? '<ol class="steps">'+m.steps.map(function(s){ return '<li><span>'+rich(s)+'</span></li>'; }).join("")+'</ol>'
    : '<div class="blank">未記入</div>';
  var links=m.links.length?'<div class="links">'+m.links.map(function(l){
      return l.url?'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label||l.url)+'</a>'
                  :'<span class="nourl">'+esc(l.label||"")+'</span>';
    }).join("")+'</div>':"";

  sheetEl.innerHTML=
    '<div class="sheet-bar"><button class="back" data-act="close">← 一覧</button><div class="right">'
    + '<button class="txtbtn" data-act="fav">'+(m.fav?"★":"☆")+'</button>'
    + '<button class="txtbtn primary" data-act="edit">編集</button></div></div>'
    + '<div class="title-block"><h1>'+esc(m.name)+'</h1>'
    + (m.yomi?'<div class="yomi">'+esc(toKata(m.yomi))+'</div>':"")
    + (spec?'<div class="spec">'+spec+'</div>':"")+tenjoHTML(m)+'</div>'
    + sec("s1","1","狙い目",bordersHTML(m))
    + sec("s2","2","やめどき早見表",yameHTML(m))
    + sec("s3","3","やめ手順",steps)
    + sec("s4","4","モード・テーブル推測",m.mode?'<div class="body">'+rich(m.mode)+'</div>':'<div class="blank">未記入</div>')
    + sec("s5","5","その他・仕組み",m.other?'<div class="body">'+rich(m.other)+'</div>':'<div class="blank">未記入</div>')
    + (links?sec("s5","6","参考リンク",links):"");
  sheetEl.dataset.id=id; sheetEl.dataset.mode="view";
  sheetEl.classList.add("open"); sheetEl.scrollTop=0;
  var yf=document.getElementById("yfilter");
  if(yf) yf.addEventListener("input",function(){
    var q=toKata(yf.value).toLowerCase(), rows=document.querySelectorAll("#ylist .yrow"),i;
    for(i=0;i<rows.length;i++) rows[i].style.display=(!q||rows[i].dataset.t.indexOf(q)>=0)?"":"none";
  });
}

function optionList(arr,cur,useKey){
  return arr.map(function(o){
    var v=useKey?o.k:o, t=useKey?o.t:o;
    return '<option value="'+esc(v)+'"'+(v===cur?" selected":"")+'>'+esc(t)+'</option>';
  }).join("");
}
function tenjoRowHTML(t,i){
  return '<div class="editrow" data-kind="tenjo" data-i="'+i+'"><button class="rm" data-rm="tenjo" data-i="'+i+'">削除</button>'
   + '<div class="field"><label><b>種別</b></label><select data-f="kind">'+optionList(TENJO_KINDS,t.kind||"通常天井",false)+'</select></div>'
   + '<div class="field otherfield"'+(t.kind==="その他"?"":' style="display:none"')+'><label><b>種別の名前</b></label><input data-f="kindOther" value="'+esc(t.kindOther||"")+'" placeholder="有利区間天井 等"></div>'
   + '<div class="field"><label><b>通常 / リセット</b></label><select data-f="state">'+optionList(TENJO_STATES,t.state||"normal",true)+'</select></div>'
   + '<div class="field"><label><b>到達ゲーム数・条件</b></label><input data-f="games" value="'+esc(t.games||"")+'" placeholder="999G / CZ非当選5回"></div>'
   + '<div class="field"><label><b>恩恵</b></label><input data-f="benefit" value="'+esc(t.benefit||"")+'" placeholder="AT確定 / CZ当選"></div>'
   + '<div class="field"><label><b>メモ</b></label><input data-f="note" value="'+esc(t.note||"")+'" placeholder="AT後は短縮 等"></div></div>';
}
function borderRowHTML(b,i){
  return '<div class="editrow" data-kind="border" data-i="'+i+'"><button class="rm" data-rm="border" data-i="'+i+'">削除</button>'
   + '<div class="field"><label><b>グループ</b></label><input data-f="group" value="'+esc(b.group||"")+'" placeholder="CZ間天井狙い"></div>'
   + '<div class="field"><label><b>条件</b></label><input data-f="label" value="'+esc(b.label||"")+'" placeholder="AT後 / 設定変更後"></div>'
   + '<div class="grid2"><div class="field"><label><b>ここから</b></label><input data-f="from" value="'+esc(b.from||"")+'" placeholder="390G"></div>'
   + '<div class="field"><label><b>ここまで</b></label><input data-f="until" value="'+esc(b.until||"")+'" placeholder="CZ当選まで"></div></div>'
   + '<div class="field"><label><b>メモ（空欄の行は※注記になります）</b></label><input data-f="note" value="'+esc(b.note||"")+'"></div></div>';
}
function yameRowHTML(y,i){
  return '<div class="editrow" data-kind="yame" data-i="'+i+'"><button class="rm" data-rm="yame" data-i="'+i+'">削除</button>'
   + '<div class="field"><label><b>種別</b></label><select data-f="kind">'+optionList(KINDS,y.kind||"終了画面",false)+'</select></div>'
   + '<div class="field otherfield"'+(y.kind==="その他"?"":' style="display:none"')+'><label><b>種別の名前</b></label><input data-f="kindOther" value="'+esc(y.kindOther||"")+'" placeholder="ボイス / 筐体ランプ 等"></div>'
   + '<div class="field"><label><b>見たもの</b></label><input data-f="trigger" value="'+esc(y.trigger||"")+'" placeholder="スクール"></div>'
   + '<div class="field"><label><b>どうする</b></label><select data-f="action">'+optionList(ACTIONS,y.action||"cz",true)+'</select></div>'
   + '<div class="field actionfield"'+(y.action==="other"?"":' style="display:none"')+'><label><b>続行条件の内容</b></label><input data-f="actionText" value="'+esc(y.actionText||"")+'" placeholder="消化まで 等"></div>'
   + '<div class="field"><label><b>メモ</b></label><input data-f="note" value="'+esc(y.note||"")+'"></div></div>';
}
function stepRowHTML(s,i){
  return '<div class="editrow" data-kind="step" data-i="'+i+'"><button class="rm" data-rm="step" data-i="'+i+'">削除</button>'
   + '<div class="field"><label><b>手順 '+(i+1)+'</b></label><input data-f="text" value="'+esc(s||"")+'" placeholder="PUSHで1枚絵と上部パネルを確認"></div></div>';
}
function linkRowHTML(l,i){
  return '<div class="editrow" data-kind="link" data-i="'+i+'"><button class="rm" data-rm="link" data-i="'+i+'">削除</button>'
   + '<div class="field"><label><b>名前</b></label><input data-f="label" value="'+esc(l.label||"")+'"></div>'
   + '<div class="field"><label><b>URL</b></label><input data-f="url" value="'+esc(l.url||"")+'" inputmode="url" placeholder="https://"></div></div>';
}
function renderSub(kind){
  var box=document.getElementById("box-"+kind);
  if(!box) return;
  if(kind==="tenjo")  box.innerHTML=draft.tenjos.map(tenjoRowHTML).join("");
  if(kind==="border") box.innerHTML=draft.borders.map(borderRowHTML).join("");
  if(kind==="yame")   box.innerHTML=draft.yamedoki.map(yameRowHTML).join("");
  if(kind==="step")   box.innerHTML=draft.steps.map(stepRowHTML).join("");
  if(kind==="link")   box.innerHTML=draft.links.map(linkRowHTML).join("");
}
function syncDraft(){
  var g=function(k){ var el=sheetEl.querySelector('[data-k="'+k+'"]'); return el?el.value:""; };
  ["name","yomi","maker","type","neraimeMemo","yamedokiMemo","mode","other"].forEach(function(k){ draft[k]=g(k); });
  var rows=sheetEl.querySelectorAll(".editrow"),i,j;
  for(i=0;i<rows.length;i++){
    var row=rows[i], kind=row.dataset.kind, idx=+row.dataset.i, o={};
    var fs=row.querySelectorAll("[data-f]");
    for(j=0;j<fs.length;j++) o[fs[j].dataset.f]=fs[j].value;
    if(kind==="tenjo")  draft.tenjos[idx]=o;
    if(kind==="border") draft.borders[idx]=o;
    if(kind==="yame")   draft.yamedoki[idx]=o;
    if(kind==="step")   draft.steps[idx]=o.text;
    if(kind==="link")   draft.links[idx]=o;
  }
}
function openEdit(id){
  var src=id?find(id):blank();
  draft=normalize(JSON.parse(JSON.stringify(src)));
  sheetEl.innerHTML=
    '<div class="sheet-bar"><button class="back" data-act="cancel">← 取消</button><div class="right">'
    + (id?'<button class="txtbtn danger" data-act="delete">削除</button>':"")
    + '<button class="txtbtn primary" data-act="save">保存</button></div></div>'
    + '<div class="form">'
    + '<div class="field"><label><b>機種名</b></label><input data-k="name" value="'+esc(draft.name)+'"></div>'
    + '<div class="field"><label><b>よみ（五十音順に使用）</b></label><input data-k="yomi" value="'+esc(draft.yomi)+'" placeholder="トアルマジュツノインデックス2"></div>'
    + '<div class="grid2"><div class="field"><label><b>メーカー</b></label><input data-k="maker" value="'+esc(draft.maker)+'"></div>'
    + '<div class="field"><label><b>タイプ</b></label><input data-k="type" value="'+esc(draft.type)+'"></div></div>'
    + '<div class="subhead"><span class="num" style="background:var(--ink-mid)">天</span>天井と恩恵</div>'
    + '<div id="box-tenjo"></div><button class="addrow" data-add="tenjo">＋ 天井を追加</button>'
    + '<div class="subhead s1"><span class="num">1</span>狙い目</div>'
    + '<div id="box-border"></div><button class="addrow" data-add="border">＋ 狙い目の行を追加</button>'
    + '<div class="field"><label><b>狙い目の補足</b></label><textarea data-k="neraimeMemo">'+esc(draft.neraimeMemo)+'</textarea></div>'
    + '<div class="subhead s2"><span class="num">2</span>やめどき早見表</div>'
    + '<div id="box-yame"></div><button class="addrow" data-add="yame">＋ 早見表の行を追加</button>'
    + '<div class="field"><label><b>早見表の補足</b></label><textarea data-k="yamedokiMemo">'+esc(draft.yamedokiMemo)+'</textarea></div>'
    + '<div class="subhead s3"><span class="num">3</span>やめ手順</div>'
    + '<div id="box-step"></div><button class="addrow" data-add="step">＋ 手順を追加</button>'
    + '<div class="subhead s4"><span class="num">4</span>モード・テーブル推測</div>'
    + '<div class="field"><label><b>前兆／履歴／ランプから読む</b></label><textarea data-k="mode">'+esc(draft.mode)+'</textarea></div>'
    + '<div class="subhead s5"><span class="num">5</span>その他・仕組み</div>'
    + '<div class="field"><label><b>打ち方・仕組み・注意点</b></label><textarea data-k="other">'+esc(draft.other)+'</textarea></div>'
    + '<div class="subhead s5"><span class="num">6</span>参考リンク</div>'
    + '<div id="box-link"></div><button class="addrow" data-add="link">＋ リンクを追加</button>'
    + '<div class="hint">【 】で囲むと<span class="marker-ex">蛍光マーカー</span>が付きます。全文を写すよりURLを残して要点だけ書くほうが安全です。</div>'
    + '</div>';
  ["tenjo","border","yame","step","link"].forEach(renderSub);
  sheetEl.dataset.id=id||""; sheetEl.dataset.mode="edit";
  sheetEl.classList.add("open"); sheetEl.scrollTop=0;
}

listEl.addEventListener("click",function(e){ var b=e.target.closest(".item"); if(b) openDetail(b.dataset.id); });
railEl.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  var t=document.getElementById("row-"+b.dataset.row);
  if(t) t.scrollIntoView({behavior:"smooth",block:"start"}); else toast("「"+b.dataset.row+"」はまだありません");
});
sheetEl.addEventListener("change",function(e){
  var sel=e.target;
  if(!sel||sel.tagName!=="SELECT") return;
  var row=sel.closest(".editrow"); if(!row) return;
  var cls=(sel.dataset.f==="kind")?".otherfield":(sel.dataset.f==="action")?".actionfield":null;
  if(!cls) return;
  var box=row.querySelector(cls); if(!box) return;
  var show=(sel.dataset.f==="kind")?(sel.value==="その他"):(sel.value==="other");
  box.style.display=show?"":"none";
  if(show){ var inp=box.querySelector("input"); if(inp) inp.focus(); }
});
sheetEl.addEventListener("click",function(e){
  var add=e.target.closest("[data-add]");
  if(add){
    syncDraft();
    var k=add.dataset.add,p;
    if(k==="tenjo"){ p=draft.tenjos[draft.tenjos.length-1]||{}; draft.tenjos.push({kind:"通常天井",kindOther:"",state:p.state||"normal",games:"",benefit:"",note:""}); }
    if(k==="border"){ p=draft.borders[draft.borders.length-1]||{}; draft.borders.push({group:p.group||"",label:"",from:"",until:"",note:""}); }
    if(k==="yame"){ p=draft.yamedoki[draft.yamedoki.length-1]||{}; draft.yamedoki.push({kind:p.kind||"終了画面",kindOther:"",trigger:"",action:"cz",actionText:"",note:""}); }
    if(k==="step") draft.steps.push("");
    if(k==="link") draft.links.push({label:"",url:""});
    renderSub(k); return;
  }
  var rm=e.target.closest("[data-rm]");
  if(rm){
    syncDraft();
    var kk=rm.dataset.rm, i=+rm.dataset.i;
    if(kk==="tenjo") draft.tenjos.splice(i,1);
    if(kk==="border") draft.borders.splice(i,1);
    if(kk==="yame") draft.yamedoki.splice(i,1);
    if(kk==="step") draft.steps.splice(i,1);
    if(kk==="link") draft.links.splice(i,1);
    renderSub(kk); return;
  }
  var b=e.target.closest("[data-act]"); if(!b) return;
  var act=b.dataset.act, id=sheetEl.dataset.id;
  if(act==="close"||act==="cancel") close();
  else if(act==="edit") openEdit(id);
  else if(act==="fav"){ var m=find(id); if(m){ m.fav=!m.fav; save(); openDetail(id); renderList(); } }
  else if(act==="save"){
    syncDraft();
    if(!draft.name.trim()){ toast("機種名を入力してください"); return; }
    draft.steps=draft.steps.filter(function(s){ return (s||"").trim(); });
    draft.updated=Date.now();
    if(id){ var t=find(id); Object.keys(draft).forEach(function(k){ if(k!=="id"&&k!=="fav") t[k]=draft[k]; }); }
    else { draft.id=uid(); data.items.push(draft); id=draft.id; }
    save(); renderList(); openDetail(id); toast("保存しました");
  }
  else if(act==="delete"){
    if(confirm("この機種を削除します。元に戻せません。")){
      data.items=data.items.filter(function(x){ return x.id!==id; });
      save(); renderList(); close(); toast("削除しました");
    }
  }
});
function close(){ sheetEl.classList.remove("open"); sheetEl.dataset.mode="";
  setTimeout(function(){ if(!sheetEl.classList.contains("open")) sheetEl.innerHTML=""; },240); }

$("#q").addEventListener("input",function(e){ query=e.target.value.trim(); renderList(); });
$("#favBtn").addEventListener("click",function(e){ favOnly=!favOnly; e.currentTarget.setAttribute("aria-pressed",favOnly?"true":"false"); renderList(); });
$("#addBtn").addEventListener("click",function(){ openEdit(""); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape") close(); });

$("#exportBtn").addEventListener("click",function(){
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="neraime-jiten-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
});
$("#importBtn").addEventListener("click",function(){ $("#importFile").click(); });
$("#importFile").addEventListener("change",function(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var j=JSON.parse(r.result);
      if(!j||!Array.isArray(j.items)) throw new Error("bad");
      var mode="2";
      if(data.items.length){
        mode=prompt("1 ＝ 今のデータに追加して統合\n2 ＝ すべて置き換え","1");
        if(mode===null) return;
      }
      var incoming=j.items.map(normalize);
      if(mode==="2"){ data={items:incoming}; }
      else{
        incoming.forEach(function(n){
          var dup=null,i;
          for(i=0;i<data.items.length;i++) if(data.items[i].name===n.name) dup=data.items[i];
          if(dup){ Object.keys(n).forEach(function(k){ if(k!=="id") dup[k]=n[k]; }); }
          else { n.id=uid(); data.items.push(n); }
        });
      }
      save(); renderList(); toast("読み込みました（"+incoming.length+"機種）");
    }catch(err){ toast("読み込めませんでした。ファイル形式を確認してください"); }
  };
  r.readAsText(f); e.target.value="";
});

renderList();
})();
</script>
