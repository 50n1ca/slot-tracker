<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>当選履歴</title>
<style>
:root{
  --paper:#E4E2DB; --paper-hi:#F1EFE9;
  --ink:#16161A; --ink-mid:#4A4842; --ink-soft:#7C796F; --rule:#C6C3B9;
  --s1:#D4004E; --s2:#0B3FC7; --s3:#0A7A4B; --s4:#6A1FB0;
  --marker:#F3E64A;
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,"Hiragino Kaku Gothic ProN",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--s2);outline-offset:2px}

.hdr{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1.5px solid var(--ink);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
.hdr h1{font-size:18px;font-weight:800;letter-spacing:-.04em;margin:0;flex:1;min-width:0;line-height:1.25}
.hdr h1 .sub{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--ink-soft);font-weight:400;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1.5px solid var(--ink);padding:7px 10px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--paper-hi)}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.dan{border-color:var(--s1);color:var(--s1);background:transparent}
.back{font-size:14px;font-weight:700;flex:none}

main{padding:0 0 100px}
.sec{padding:16px 14px 0}
.sechead{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--ink-soft);border-bottom:1.5px solid var(--ink);padding-bottom:4px;margin-bottom:9px}

.row{display:block;width:100%;text-align:left;border:1.5px solid var(--ink);background:var(--paper-hi);padding:10px 11px;margin-bottom:9px}
.row:active{background:var(--paper)}
.row .t{display:flex;align-items:baseline;gap:8px}
.row .t b{font-size:16px;font-weight:800;flex:1;min-width:0}
.row .t span{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.row .m{font-size:12px;color:var(--ink-mid);margin-top:4px}

.hit{display:flex;align-items:stretch;border:1.5px solid var(--ink);background:var(--paper-hi);margin-bottom:8px;overflow:hidden}
.hit .no{width:34px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:700;background:var(--ink);color:var(--paper)}
.hit .body{flex:1;min-width:0;padding:8px 10px;text-align:left}
.hit .g{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:-.02em}
.hit .g small{font-size:11px;font-weight:400;color:var(--ink-soft);margin-left:2px}
.hit .tg{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;background:var(--s4);padding:2px 6px;margin-left:8px;vertical-align:2px}
.hit .tg.at{background:var(--s1)}
.hit .tg.tr{background:var(--s2)}
.hit .tg.ng{background:var(--ink-soft)}
.hit .tg.out{background:transparent;color:var(--ink-soft);border:1px solid var(--rule)}
.hit .memo{font-size:12px;color:var(--ink-mid);margin-top:3px;word-break:break-word}
.hit .ex{font-size:11.5px;color:var(--ink-soft);margin-top:2px}

.memobox{border:1.5px solid var(--ink);background:var(--paper-hi);padding:10px 11px;margin-bottom:10px;width:100%;text-align:left;display:block}
.memobox .ph{color:var(--ink-soft);font-size:13px}
.memobox .tx{white-space:pre-wrap;font-size:14px;line-height:1.7;word-break:break-word}
.memoedit textarea{width:100%;background:var(--paper-hi);border:1.5px solid var(--ink);padding:10px;font-size:16px;line-height:1.7;min-height:110px;border-radius:0}
.memoedit .btns{display:flex;gap:8px;margin-top:8px}
.memoedit .btns button{flex:1;padding:10px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat div{border:1.5px solid var(--ink);background:var(--paper-hi);padding:8px 10px}
.stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink-soft)}
.stat .v{font-family:var(--mono);font-size:20px;font-weight:700}
.stat .v small{font-size:11px;font-weight:400;color:var(--ink-soft)}

.bar{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px}
.bar .lab{width:78px;flex:none;font-family:var(--mono);font-size:11px;color:var(--ink-mid)}
.bar .track{flex:1;height:14px;background:var(--rule)}
.bar .fill{height:100%;background:var(--s2)}
.bar .n{width:34px;flex:none;text-align:right;font-family:var(--mono);font-size:12px;font-weight:700}

.field{margin-top:14px}
.field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-soft);margin-bottom:5px}
.field label b{font-family:var(--sans);font-size:12.5px;letter-spacing:0;color:var(--ink)}
.field input,.field textarea,.field select{width:100%;background:var(--paper-hi);border:1.5px solid var(--ink);padding:9px 10px;font-size:16px;appearance:none;-webkit-appearance:none;border-radius:0}
.field textarea{min-height:76px}
.gnum input{font-family:var(--mono);font-size:30px;font-weight:700;text-align:center;padding:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--ink);background:var(--paper-hi);padding:9px 11px;font-size:13.5px;font-weight:700}
.chip.on{background:var(--ink);color:var(--paper)}
.chip.add{border-style:dashed;font-weight:400;color:var(--ink-soft)}
.chip.atbtn.on{background:var(--s1);border-color:var(--s1)}

.editline{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.editline input{flex:1;background:var(--paper-hi);border:1.5px solid var(--ink);padding:8px 10px;font-size:16px;border-radius:0}
.editline button{border:1.5px solid var(--s1);color:var(--s1);padding:7px 9px;font-size:12px;font-weight:700;flex:none}
.editline button.atflag{border-color:var(--rule);color:var(--ink-soft)}
.editline button.atflag.on{border-color:var(--s1);background:var(--s1);color:#fff}

.fab{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:30;background:var(--ink);color:var(--paper);border:1.5px solid var(--ink);padding:14px;font-size:15px;font-weight:800;text-align:center}
.backupwarn{display:none;background:var(--s1);color:#fff;padding:10px 14px;font-size:12.5px;line-height:1.6;align-items:center;gap:10px}
.backupwarn.show{display:flex}
.backupwarn button{flex:none;border:1.5px solid #fff;color:#fff;font-size:12px;font-weight:700;padding:5px 9px}
.stbadge{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 5px;margin-left:6px;vertical-align:1px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper)}
.stbadge.guess{background:transparent;color:var(--ink);border-style:dashed}
.settei-pick{display:flex;gap:6px}
.settei-pick button{flex:1;text-align:center;font-family:var(--mono);font-size:17px;font-weight:700;padding:8px 0;border:1.5px solid var(--ink);background:var(--paper-hi)}
.settei-pick button.on{background:var(--ink);color:var(--paper)}
.lastexp{font-size:12px;color:var(--ink-soft);margin-top:6px}
.lastexp.warn{color:var(--s1);font-weight:700}
.empty{padding:50px 20px;text-align:center;color:var(--ink-soft);font-size:14px;line-height:2}
.note{padding:16px 14px 40px;font-size:11.5px;color:var(--ink-soft);line-height:1.7}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--paper);font-size:13px;font-weight:700;padding:10px 16px;z-index:60;opacity:0;pointer-events:none;transition:.18s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.chip.sm{padding:7px 9px;font-size:12.5px}
.ghseg{display:block;width:100%;text-align:left;border:1.5px solid var(--ink);background:var(--paper-hi);padding:8px 10px;margin-bottom:8px}
.ghseg:active{background:var(--paper)}
.ghseg .h{display:flex;align-items:baseline;gap:8px}
.ghseg .h b{font-family:var(--mono);font-size:12px;width:18px;flex:none}
.ghseg .h .p{font-family:var(--mono);font-size:14px;font-weight:700;flex:1;min-width:0}
.ghseg .h .r{font-size:14px;font-weight:800;flex:none}
.ghtype{flex:none;font-size:10.5px;font-weight:700;padding:1px 5px;border:1px solid var(--rule);color:var(--ink-soft)}
.ghtype.z{background:var(--marker);border-color:var(--ink);color:var(--ink)}
.ghbar{display:flex;height:14px;margin:6px 0 4px;background:var(--rule)}
.ghbar span{display:block;height:100%}
.ghtop{font-size:12px;color:var(--ink-mid)}
.ghwarn{font-size:11.5px;color:var(--s1);font-weight:700;margin-top:2px}
.ghleg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--ink-mid);margin:0 0 8px}
.ghleg i{display:inline-block;width:10px;height:10px;margin-right:3px;vertical-align:-1px}
.ghobs{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.ghobs .lab{width:46px;flex:none;font-family:var(--mono);font-size:12px;font-weight:700}
</style>
</head>
<body>

<header class="hdr" id="hdr"></header>
<main id="view"></main>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

var APP_VERSION="2026-10-01.2";   /* 更新のたびに変える：日付.その日の何回目か */
var KEY="tousen-rireki-v1";
var DEFAULT_TRIGGERS=["ゲーム数","ゲーム数（書き換え）","弱チェリー","強チェリー","スイカ","チャンス目","リプレイ","CZ経由","直撃","不明"];
var DEFAULT_ZONE_TRIGGERS=["ゲーム数","ゲーム数（書き換え）"];
var DEFAULT_KINDS=[{name:"CZ",at:false},{name:"ボーナス",at:false},{name:"AT",at:true}];
function dualOf(m){ return !!(m&&m.dualG); }
function zoneTriggersOf(m){
  return (m&&Array.isArray(m.zoneTriggers))?m.zoneTriggers:DEFAULT_ZONE_TRIGGERS.slice();
}
function zoneCounted(m,x){
  if(x.zone==="yes") return true;
  if(x.zone==="no") return false;
  return zoneTriggersOf(m).indexOf(x.trigger||"")>=0;
}
function gLabels(m){
  var L=(m&&m.gLabels)||{};
  return {main:L.main||"実ゲーム数", zone:L.zone||"液晶ゲーム数"};
}
function zoneG(m,x){
  if(dualOf(m) && x.g2!=="" && x.g2!=null && !isNaN(+x.g2)) return +x.g2;
  return +x.g||0;
}
function kindsOf(m){ return (m&&Array.isArray(m.kinds)&&m.kinds.length)?m.kinds:DEFAULT_KINDS.slice(); }
function isAtKind(m,name){
  var ks=kindsOf(m),i;
  for(i=0;i<ks.length;i++) if(ks[i].name===name) return !!ks[i].at;
  return false;
}

var data={machines:[],sessions:[],meta:{}};
try{ var r=localStorage.getItem(KEY); if(r) data=JSON.parse(r)||data; }catch(e){}
if(!Array.isArray(data.machines)) data.machines=[];
if(!Array.isArray(data.sessions)) data.sessions=[];
if(!data.meta) data.meta={};
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){ toast("保存できませんでした"); } }

function uid(p){ return (p||"x")+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
var toastEl=document.getElementById("toast"), tId=null;
function toast(m){ toastEl.textContent=m; toastEl.classList.add("show"); clearTimeout(tId);
  tId=setTimeout(function(){ toastEl.classList.remove("show"); },1700); }
function today(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function fmtDate(s){ if(!s) return ""; var p=String(s).split("-"); return p.length===3?(+p[1])+"/"+(+p[2]):s; }

function setteiCands(s){
  if(!s) return [];
  if(Array.isArray(s.setteiCands)) return s.setteiCands.slice().sort();
  if(s.settei) return [+s.settei];           /* 旧データの移行 */
  return [];
}
function setteiCore(c){
  if(!c.length || c.length===6) return "";
  if(c.length===1) return "設定"+c[0];
  var j=c.join(",");
  if(j==="2,4,6") return "偶数";
  if(j==="1,3,5") return "奇数";
  var contiguous=true,i;
  for(i=1;i<c.length;i++) if(c[i]!==c[i-1]+1) contiguous=false;
  if(contiguous && c[c.length-1]===6) return "設定"+c[0]+"以上";
  if(contiguous && c[0]===1) return "設定"+c[c.length-1]+"以下";
  return "設定"+c.join("/");
}
function setteiLabel(s){
  var t=setteiCore(setteiCands(s));
  if(!t) return "";
  return t+(s.setteiFixed?"":"?");
}
function setteiBadge(s){
  var t=setteiLabel(s);
  if(!t) return "";
  return '<span class="stbadge'+(s.setteiFixed?"":" guess")+'">'+t+'</span>';
}
function findMachine(id){ for(var i=0;i<data.machines.length;i++) if(data.machines[i].id===id) return data.machines[i]; return null; }
function findSession(id){ for(var i=0;i<data.sessions.length;i++) if(data.sessions[i].id===id) return data.sessions[i]; return null; }
function machineOfSession(s){ return findMachine(s.machineId)||{id:"",name:s.machineName||"",triggers:DEFAULT_TRIGGERS.slice(),zoneTriggers:DEFAULT_ZONE_TRIGGERS.slice(),kinds:DEFAULT_KINDS.slice(),fields:[]}; }

/* ---------- 集計 ---------- */
function reachedAt(m,x){
  if(x.result==="突破") return true;
  if(x.result==="失敗") return false;
  return x.kind?isAtKind(m,x.kind):!!x.at;
}
function summarize(s,m){
  var rows=s.rows||[];
  function isAt(x){ return reachedAt(m,x); }
  var n=rows.length, gs=rows.map(function(x){ return +x.g||0; });
  var sum=gs.reduce(function(a,b){ return a+b; },0);
  var avg=n?Math.round(sum/n):0;
  var max=n?Math.max.apply(null,gs):0, min=n?Math.min.apply(null,gs):0;

  var zones=[],i;
  zones.push({label:"0-100",n:0});
  for(i=1;i<10;i++) zones.push({label:(i*100+1)+"-"+((i+1)*100),n:0});
  zones.push({label:"1001+",n:0});
  var zoneRows=rows.filter(function(x){ return zoneCounted(m,x); });
  zoneRows.forEach(function(x){
    var g=zoneG(m,x);
    var k=(g<=0)?0:Math.ceil(g/100)-1;
    if(k<0) k=0; if(k>10) k=10;
    zones[k].n++;
  });

  var gaps=[], gapSum=0;
  if(dualOf(m)) rows.forEach(function(x){
    if(x.g2!=="" && x.g2!=null && !isNaN(+x.g2)){ var d=(+x.g||0)-(+x.g2); gaps.push(d); gapSum+=d; }
  });
  var gapAvg=gaps.length?Math.round(gapSum/gaps.length):null;

  var trig={}, kind={};
  rows.forEach(function(x){
    var t=x.trigger||"未設定"; trig[t]=(trig[t]||0)+1;
    var k=x.kind||"未設定"; kind[k]=(kind[k]||0)+1;
  });

  /* スルー：AT扱いの当選で区切った、非ATの連続数 */
  var runs=[], cur=0, atCount=0;
  rows.forEach(function(x){
    if(isAt(x)){ atCount++; runs.push(cur); cur=0; }
    else cur++;
  });
  var pending=cur;

  /* AT間のゲーム数 */
  var atGaps=[], acc=0;
  rows.forEach(function(x){
    acc+=(+x.g||0);
    if(isAt(x)){ atGaps.push(acc); acc=0; }
  });

  return {n:n,zoneN:zoneRows.length,sum:sum,avg:avg,max:max,min:min,zones:zones,trig:trig,kind:kind,gapAvg:gapAvg,dual:dualOf(m),
    runs:runs,pending:pending,atCount:atCount,atGaps:atGaps};
}


/* ---------- 喰種モード推測 ----------
   参照：https://note.com/mild_holly116/n/nb9394edc54b8
   数値は記事筆者の実践イメージ。50Gと天国の内訳、スルー時の移行率、事前分布は仮置き。 */
var GH_MODES=["A","B","C","CH","PR","HV"];
var GH_LABEL={A:"A",B:"B",C:"C",CH:"チャンス",PR:"天国準備",HV:"天国"};
var GH_COLOR={A:"var(--ink)",B:"var(--ink-mid)",C:"var(--ink-soft)",CH:"var(--s2)",PR:"var(--s1)",HV:"var(--s4)"};
var GH_PTS=[50,100,150,200,250,300,400,500,600];
var GH_DIST={
  A:{200:15,400:25,600:60},
  B:{100:10,300:20,500:35,600:30},
  C:{100:10,200:20,300:20,400:20,500:30},
  CH:{50:5,100:15,150:5,200:25,250:3,300:30,600:25},
  PR:{50:5,100:15,150:10,200:30,300:45},
  HV:{50:50,100:50}
};
/* CZスルー時：据え置き・1段上・天国のいずれか（転落なし）。天国スルー後はC以上へ再抽選（記事の実例より）。比率は仮置き */
var GH_TRANS={A:{A:.4,B:.4,HV:.2},B:{B:.4,C:.4,HV:.2},C:{C:.4,CH:.4,HV:.2},CH:{CH:.4,PR:.4,HV:.2},PR:{PR:.4,HV:.6},HV:{C:.3,CH:.3,PR:.2,HV:.2}};
var GH_STRONG=0.05, GH_WEAK=0.6, GH_EYE=0.25, GH_NONE=0.02, GH_FLOOR=0.001;
var GH_HIGH=["CH","PR","HV"];
var GH_INV={"246":[50,150,200,250,400,600],"135":[50,100,150,250,300,500],both:[150,250]};
var GH_INV_LABEL={"246":"2:46","135":"1:35",both:"両方"};
var GH_EYESET={t:["B","C","CH","PR","HV"],h:["C","CH","PR","HV"],k:["CH","PR","HV"]};
var GH_EYE_LABEL={t:"トーカ",h:"ヒナミ",k:"月山"};
/* 道中の前兆（モード情報があるものだけ）。w:s=濃厚 w=期待度アップ */
var GH_OBS={
  50:[{v:"up",lab:"上空あり・外れ",set:["HV"],w:"s"},{v:"noup",lab:"上空なし",set:["CH","PR","HV"],w:"s"}],
  100:[{v:"noup",lab:"上空なし",set:["PR"],w:"s"}],
  150:[{v:"noup",lab:"上空なし",set:["B","C","CH","PR","HV"],w:"s",hi:1}],
  200:[{v:"none",lab:"前兆なし",set:["PR"],w:"s"},{v:"noup",lab:"上空なし",set:["B","C","CH","PR","HV"],w:"w"}],
  250:[{v:"noup",lab:"上空なし",set:["C","CH","PR","HV"],w:"s"}],
  300:[{v:"noup",lab:"上空なし",set:["CH"],w:"s"}],
  400:[{v:"none",lab:"前兆なし",set:["C"],w:"s"}],
  500:[{v:"noup",lab:"上空なし",set:["CH"],w:"s"}]
};
function ghOn(m){
  if(!m) return false;
  if(m.analyzer==="ghoul") return true;
  if(m.analyzer==="off") return false;
  return /喰種|グール/.test(m.name||"");
}
function ghNorm(o){ var t=0,k,r={}; for(k in o) t+=o[k]; for(k in o) r[k]=t?o[k]/t:0; return r; }
var GH_P={}; GH_MODES.forEach(function(md){ GH_P[md]=ghNorm(GH_DIST[md]); });
function ghKindClass(k){
  k=k||"";
  if(/エピソード|EP/i.test(k)) return "ep";
  if(/リゼ/.test(k)) return "rize";
  if(/レミ/.test(k)) return "remi";
  return "";
}
function ghLimit(m,x){
  var gh=x.gh||{};
  if(typeof gh.pt==="number") return gh.pt;
  var g=zoneG(m,x); return g>0?g:0;
}
function ghPassed(limit){ return GH_PTS.filter(function(p){ return p<limit && GH_OBS[p]; }); }
function ghEmit(m,x,type){
  var gh=x.gh||{}, warn=[], S, zg=zoneG(m,x), e={}, hard={};
  if(typeof gh.pt==="number") S=[gh.pt];
  else if(gh.pt==="rare"){ S=GH_PTS.filter(function(p){ return p>zg; }); if(!S.length) S=GH_PTS.slice(); }
  else S=GH_PTS.slice();
  if(gh.inv && GH_INV[gh.inv]){
    var S2=S.filter(function(p){ return GH_INV[gh.inv].indexOf(p)>=0; });
    if(S2.length) S=S2; else warn.push("招待状と当選ポイントが合わないため、招待状を使っていません");
  }
  GH_MODES.forEach(function(md){
    var v=0; S.forEach(function(p){ v+=GH_P[md][p]||0; });
    hard[md]=v>0?0:1;
    e[md]=v>0?v:GH_FLOOR;
  });
  function penal(set,f,strong){
    GH_MODES.forEach(function(md){ if(set.indexOf(md)<0){ e[md]*=f; if(strong) hard[md]++; } });
  }
  var eye=gh.eye||{};
  ["t","h","k"].forEach(function(c){ var n=+eye[c]||0, i; for(i=0;i<n;i++) penal(GH_EYESET[c],GH_EYE,false); });
  if(gh.kake && type==="0スルー") penal(["B","C","CH","PR","HV"],GH_NONE,true);
  if(typeof gh.pt==="number"){
    var kc=ghKindClass(x.kind);
    if(kc==="ep"){ e.A*=GH_NONE; e.B*=GH_NONE; e.C*=0.2; }
    else if(kc==="rize"){ e.A*=GH_NONE; e.B*=0.3; }
  }
  if(!gh.mix){
    var obs=gh.obs||{};
    ghPassed(ghLimit(m,x)).forEach(function(p){
      var v=obs[p]; if(!v) return;
      GH_OBS[p].forEach(function(o){
        if(o.v!==v) return;
        penal(o.set,o.w==="s"?GH_STRONG:GH_WEAK,o.w==="s");
        if(o.hi) penal(GH_HIGH,GH_WEAK,false);
      });
    });
  }
  var minHard=Math.min.apply(null,GH_MODES.map(function(md){ return hard[md]; }));
  if(minHard>0) warn.push("入力どうしが矛盾しています。当選ポイントと前兆を確認してください");
  return {e:e,warn:warn};
}
function ghStep(a){
  var r={}; GH_MODES.forEach(function(md){ r[md]=0; });
  GH_MODES.forEach(function(from){ var tr=GH_TRANS[from], to; for(to in tr) r[to]+=a[from]*tr[to]; });
  return r;
}
function ghStartType(s){ return s.ghStart==="reset"?"朝一":(s.ghStart==="zero"?"0スルー":"不明"); }
function ghTypeAt(s,m,i){
  if(i===0) return ghStartType(s);
  return reachedAt(m,s.rows[i-1])?"0スルー":"スルー後";
}
/* 同じATまでのCZ区間を1本の鎖として前向き・後ろ向きに平滑化 */
function ghAnalyze(s,m){
  var rows=s.rows||[], segs=[], chains=[], cur=null;
  rows.forEach(function(x,i){
    var type=ghTypeAt(s,m,i);
    if(type!=="スルー後"){ cur=[]; chains.push(cur); }
    var em=ghEmit(m,x,type);
    var seg={i:i,x:x,type:type,e:em.e,warn:em.warn};
    cur.push(seg); segs.push(seg);
  });
  chains.forEach(function(ch){
    var k=ch.length, al=[], be=[], t, pri={};
    GH_MODES.forEach(function(md){ pri[md]=1/6; });
    for(t=0;t<k;t++){
      var prev=(t===0)?pri:ghStep(al[t-1]), a={};
      GH_MODES.forEach(function(md){ a[md]=prev[md]*ch[t].e[md]; });
      al.push(ghNorm(a));
    }
    be[k-1]={}; GH_MODES.forEach(function(md){ be[k-1][md]=1; });
    for(t=k-2;t>=0;t--){
      var b={};
      GH_MODES.forEach(function(from){
        var v=0, tr=GH_TRANS[from], to;
        for(to in tr) v+=tr[to]*ch[t+1].e[to]*be[t+1][to];
        b[from]=v;
      });
      be[t]=ghNorm(b);
    }
    for(t=0;t<k;t++){
      var p={}; GH_MODES.forEach(function(md){ p[md]=al[t][md]*be[t][md]; });
      ch[t].post=ghNorm(p);
    }
  });
  return segs;
}
function ghSummary(s,m,segs){
  var z=segs.filter(function(t){ var g=t.x.gh; return t.type==="0スルー" && g && g.pt!==undefined && g.pt!==""; });
  var hi=0, pr=0;
  z.forEach(function(t){ hi+=t.post.CH+t.post.PR+t.post.HV; pr+=t.post.PR; });
  var pts=(s.rows||[]).filter(function(x){ return x.gh && typeof x.gh.pt==="number"; });
  var over=pts.filter(function(x){ return x.gh.pt>300; }).length;
  var morning=null;
  if(segs.length && segs[0].type==="朝一"){
    var x=segs[0].x, gh=x.gh||{}, eye=gh.eye||{}, o50=(gh.obs||{})[50];
    if(gh.pt===200 && ghKindClass(x.kind)==="remi" && !(+eye.h) && !(+eye.k) && !o50) morning="none200";
  }
  return {zN:z.length,hi:hi,pr:pr,ptN:pts.length,over:over,morning:morning};
}
function ghPtText(m,x){
  var gh=x.gh||{}, eye=gh.eye||{}, t;
  if(typeof gh.pt==="number") t=gh.pt+"G";
  else if(gh.pt==="rare") t=zoneG(m,x)+"G レア役";
  else t=zoneG(m,x)+"G";
  var e=[];
  ["t","h","k"].forEach(function(c){ if(+eye[c]) e.push(GH_EYE_LABEL[c]+eye[c]); });
  if(gh.inv) e.push(GH_INV_LABEL[gh.inv]);
  return t+(e.length?"（"+e.join("・")+"）":"");
}

    var brk={};
    (s.rows||[]).forEach(function(x){
      var k=x.kind||"未設定";
      if(!brk[k]) brk[k]={ok:0,ng:0};
      if(x.result==="突破") brk[k].ok++;
      else if(x.result==="失敗") brk[k].ng++;
    });
    var kmx=1; kk.forEach(function(k){ if(sm.kind[k]>kmx) kmx=sm.kind[k]; });
    kk.forEach(function(k){
      html+='<div class="bar"><span class="lab">'+esc(k)+'</span>'
        + '<span class="track"><span class="fill" style="width:'+Math.round(sm.kind[k]/kmx*100)+'%;background:var(--s4)"></span></span>'
        + '<span class="n">'+sm.kind[k]+'</span></div>'
        + (function(){
            var b=brk[k]||{ok:0,ng:0}, tt=b.ok+b.ng;

            return '<div style="font-size:11.5px;color:var(--ink-mid);margin:-2px 0 4px 86px">'

          })();
    });

    html+='<div class="sechead" style="margin-top:14px">当選契機</div>';
    var keys=Object.keys(sm.trig).sort(function(a,b){ return sm.trig[b]-sm.trig[a]; });
    var tmx=1; keys.forEach(function(k){ if(sm.trig[k]>tmx) tmx=sm.trig[k]; });
    keys.forEach(function(k){
      html+='<div class="bar"><span class="lab">'+esc(k)+'</span>'
        + '<span class="track"><span class="fill" style="width:'+Math.round(sm.trig[k]/tmx*100)+'%;background:var(--s3)"></span></span>'
        + '<span class="n">'+sm.trig[k]+'</span></div>';
    });
  }
  html+='</section>';

  html+='<section class="sec"><div class="sechead">MEMO</div>';
  if(view.memoEdit){
    html+='<div class="memoedit"><textarea id="sMemo" placeholder="重いフラグ、フリーズ、据え置き判別、店の状況など">'+esc(s.memo||"")+'</textarea>'
      + '<div class="btns"><button class="btn" data-memo="cancel">取消</button>'
      + '<button class="btn pri" data-memo="save">保存</button></div></div>';
  }else{
    html+='<button class="memobox" data-memo="edit">'
      + (s.memo?'<div class="tx">'+esc(s.memo)+'</div>':'<div class="ph">タップしてメモを書く</div>')
      + '</button>';
  }
  html+='</section>';

  html+='<section class="sec"><div class="sechead">HITS</div>';
  if(!s.rows.length) html+='<div class="empty" style="padding:30px 0">まだ当選の記録がありません。</div>';
  s.rows.forEach(function(x,i){
    var ex=[];
    (m.fields||[]).forEach(function(fd){
      var v=(x.extra||{})[fd.key];
      if(v) ex.push(fd.label+"："+v);
    });
    html+='<div class="hit"><div class="no">'+(i+1)+'</div>'
      + '<button class="body" data-edit="'+i+'">'
      +   '<div class="g">'+(+x.g||0)+'<small>G</small>'
      +   ((dualOf(m)&&x.g2!=null&&x.g2!=="")?'<small style="margin-left:6px">液晶 '+(+x.g2)+'G（差'+(((+x.g||0)-(+x.g2))>=0?"+":"")+((+x.g||0)-(+x.g2))+'）</small>':"")
      +   (x.kind?'<span class="tg'+(isAtKind(m,x.kind)?" at":"")+'">'+esc(x.kind)+'</span>':"")
      +   (zoneCounted(m,x)?"":'<span class="tg out">ゾーン外</span>')
      +   (x.result?'<span class="tg'+(x.result==="突破"?" at":" ng")+'">'+esc(x.result)+'</span>':"")
      +   (x.trigger?'<span class="tg tr">'+esc(x.trigger)+'</span>':"")+'</div>'
      +   (x.memo?'<div class="memo">'+esc(x.memo)+'</div>':"")
      +   (ex.length?'<div class="ex">'+esc(ex.join("　"))+'</div>':"")
      + '</button></div>';
  });
  html+='</section>';
  html+='<section class="sec"><button class="btn dan" data-delsession="1" style="width:100%;padding:11px">このセッションを削除</button></section>';

  viewEl.innerHTML=html;
  removeFab();
  var fab=document.createElement("button");
  fab.className="fab"; fab.id="fab"; fab.textContent="＋ 当選を記録";
  fab.addEventListener("click",function(){ go({name:"entry",id:s.id,row:-1}); });
  document.body.appendChild(fab);
}

/* ---------- 当選入力 ---------- */
var pending={g:"",g2:"",kind:"",result:"",trigger:"",zone:"",memo:"",extra:{},gh:ghBlank()};
function renderEntry(){
  var s=findSession(view.id); if(!s) return go({name:"home"});
  var m=machineOfSession(s);
  var isEdit=view.row>=0;
  var x=isEdit?s.rows[view.row]:{g:"",g2:"",kind:"",result:"",trigger:"",zone:"",memo:"",extra:{}};
  if(!view._loaded){
    pending={g:x.g||"",g2:(x.g2===0?0:(x.g2||"")),kind:x.kind||"",result:x.result||"",trigger:x.trigger||"",zone:x.zone||"",memo:x.memo||"",extra:JSON.parse(JSON.stringify(x.extra||{})),gh:ghClone(x.gh)};
    view._loaded=true;
    var firstRender=true;
  }
  var ghUse=ghOn(m);

  hdrEl.innerHTML='<button class="back" data-go="session">← 戻る</button>'
    + '<h1>'+(isEdit?"当選を編集":"当選を記録")+'<span class="sub">'+esc(s.machineName)+'</span></h1>'
    + '<button class="btn pri" id="saveHit">保存</button>';

  var kindChips=kindsOf(m).map(function(k){
    return '<button class="chip'+(pending.kind===k.name?" on":"")+'" data-kind="'+esc(k.name)+'">'
      + esc(k.name)+(k.at?' <small style="font-size:9px;opacity:.7">AT</small>':"")+'</button>';
  }).join("")+'<button class="chip add" data-addkind="1">＋ 種別を追加</button>';

  var chips=(m.triggers||DEFAULT_TRIGGERS).map(function(t){
    return '<button class="chip'+(pending.trigger===t?" on":"")+'" data-trig="'+esc(t)+'">'+esc(t)+'</button>';
  }).join("")+'<button class="chip add" data-addtrig="1">＋ 契機を追加</button>';

  var extraHtml="";
  (m.fields||[]).forEach(function(fd){
    extraHtml+='<div class="field"><label><b>'+esc(fd.label)+'</b></label>'
      + '<input data-ex="'+esc(fd.key)+'" value="'+esc(pending.extra[fd.key]||"")+'"></div>';
  });

  viewEl.innerHTML='<section class="sec">'
    + (dualOf(m)
        ? '<div class="grid2">'
          + '<div class="field gnum"><label><b>① '+esc(gLabels(m).main)+'</b></label>'
          +   '<input id="gIn" inputmode="numeric" pattern="[0-9]*" value="'+esc(pending.g)+'" placeholder="0"></div>'
          + '<div class="field gnum"><label><b>① '+esc(gLabels(m).zone)+'（ゾーン判定）</b></label>'
          +   '<input id="g2In" inputmode="numeric" pattern="[0-9]*" value="'+esc(pending.g2)+'" placeholder="0"></div>'
          + '</div>'
        : '<div class="field gnum"><label><b>① 当選ゲーム数</b></label>'
          + '<input id="gIn" inputmode="numeric" pattern="[0-9]*" value="'+esc(pending.g)+'" placeholder="0"></div>')
    + '<div class="field"><label><b>② 何に当選したか</b></label><div class="chips" id="kindWrap">'+kindChips+'</div></div>'
    + (pending.kind && !isAtKind(m,pending.kind)
        ? '<div class="field"><label><b>結果</b></label><div class="chips" id="resWrap">'
          + '<button class="chip'+(pending.result==="突破"?" on":"")+'" data-res="突破">突破（AT当選）</button>'
          + '<button class="chip'+(pending.result==="失敗"?" on":"")+'" data-res="失敗">失敗</button>'
          + '</div></div>'
        : '')
    + '<div class="field"><label><b>③ 当選契機</b></label><div class="chips" id="trigWrap">'+chips+'</div></div>'
    + (function(){
        var eff=zoneCounted(m,{trigger:pending.trigger,zone:pending.zone});
        var auto=!pending.zone;
        return '<div class="field"><label><b>ゾーン当選として数えるか</b></label><div class="chips" id="zoneWrap">'
          + '<button class="chip'+(eff?" on":"")+'" data-zone="1">'
          + (eff?"数える":"数えない")+(auto?' <small style="font-size:9px;opacity:.7">自動</small>':' <small style="font-size:9px;opacity:.7">手動</small>')
          + '</button>'
          + (pending.zone?'<button class="chip add" data-zoneauto="1">自動に戻す</button>':"")
          + '</div></div>';
      })()
    + (ghUse?ghEntryHTML(s,m,isEdit?view.row:s.rows.length):"")
    + '<div class="field"><label><b>④ 示唆・その他</b></label>'
    +   '<textarea id="memoIn" placeholder="終了画面、ランプ、ステージなど">'+esc(pending.memo)+'</textarea></div>'
    + extraHtml
    + (isEdit?'<div class="field"><button class="btn dan" id="delHit" style="width:100%;padding:11px">この当選を削除</button></div>':"")
    + '</section>';
  removeFab();

  if(firstRender) document.getElementById("gIn").focus();

  if(ghUse){
    ["gIn","g2In"].forEach(function(id){
      var el=document.getElementById(id);
      if(el) el.addEventListener("change",function(){ syncEntry(); renderEntry(); });
    });
    viewEl.addEventListener("click",ghEntryClick);
  }

  document.getElementById("kindWrap").addEventListener("click",function(e){
    var k=e.target.closest("[data-kind]");
    if(k){
      pending.kind=(pending.kind===k.dataset.kind)?"":k.dataset.kind;
      if(!pending.kind || isAtKind(m,pending.kind)) pending.result="";
      syncEntry(); renderEntry(); return;
    }
    if(e.target.closest("[data-addkind]")){
      var nm=prompt("追加する当選種別の名前（例：レミニセンス）");
      if(nm && nm.trim()){
        var at=confirm("これはAT・上位当選として扱いますか？\nスルー回数の区切りに使います。");
        var mm=findMachine(m.id);
        if(mm){ mm.kinds=kindsOf(mm); mm.kinds.push({name:nm.trim(),at:at}); save(); }
        pending.kind=nm.trim(); syncEntry(); renderEntry();
      }
    }
  });

  var zw=document.getElementById("zoneWrap");
  if(zw) zw.addEventListener("click",function(e){
    if(e.target.closest("[data-zoneauto]")){ pending.zone=""; syncEntry(); renderEntry(); return; }
    if(e.target.closest("[data-zone]")){
      var eff=zoneCounted(m,{trigger:pending.trigger,zone:pending.zone});
      pending.zone=eff?"no":"yes";
      syncEntry(); renderEntry();
    }
  });

  var rw=document.getElementById("resWrap");
  if(rw) rw.addEventListener("click",function(e){
    var b=e.target.closest("[data-res]");
    if(!b) return;
    pending.result=(pending.result===b.dataset.res)?"":b.dataset.res;
    syncEntry(); renderEntry();
  });

  document.getElementById("trigWrap").addEventListener("click",function(e){
    var t=e.target.closest("[data-trig]");
    if(t){ pending.trigger=(pending.trigger===t.dataset.trig)?"":t.dataset.trig; syncEntry(); renderEntry(); return; }
    if(e.target.closest("[data-addtrig]")){
      var nm=prompt("追加する当選契機の名前");
      if(nm && nm.trim()){
        var mm=findMachine(m.id);
        if(mm){ if(!mm.triggers) mm.triggers=DEFAULT_TRIGGERS.slice(); mm.triggers.push(nm.trim()); save(); }
        pending.trigger=nm.trim(); syncEntry(); renderEntry();
      }
    }
  });
  document.getElementById("saveHit").addEventListener("click",function(){
    syncEntry();
    if(pending.g===""||isNaN(+pending.g)){ toast("当選ゲーム数を入力してください"); return; }
    var rec={g:+pending.g,kind:pending.kind,result:pending.result,trigger:pending.trigger,zone:pending.zone,memo:pending.memo,extra:pending.extra};
    if(ghUse) rec.gh=ghClone(pending.gh);
    else if(isEdit && x.gh) rec.gh=x.gh;
    if(dualOf(m) && pending.g2!=="" && !isNaN(+pending.g2)) rec.g2=+pending.g2;
    if(isEdit) s.rows[view.row]=rec; else s.rows.push(rec);
    save(); toast(isEdit?"更新しました":"記録しました");
    go({name:"session",id:s.id});
  });
  var dh=document.getElementById("delHit");
  if(dh) dh.addEventListener("click",function(){
    if(!confirm("この当選記録を削除します。")) return;
    s.rows.splice(view.row,1); save(); go({name:"session",id:s.id});
  });
}
function ghEntryClick(e){
  if(view.name!=="entry") return;
  var gh=pending.gh, b;
  if((b=e.target.closest("[data-ghpt]"))){
    var v=b.dataset.ghpt; v=(v==="rare")?"rare":+v;
    gh.pt=(gh.pt===v)?"":v;
  }else if((b=e.target.closest("[data-gheye]"))){
    var c=b.dataset.gheye; gh.eye[c]=((+gh.eye[c]||0)+1)%4;
  }else if((b=e.target.closest("[data-ghinv]"))){
    gh.inv=(gh.inv===b.dataset.ghinv)?"":b.dataset.ghinv;
  }else if((b=e.target.closest("[data-ghobs]"))){
    var a=b.dataset.ghobs.split(":");
    if(gh.obs[a[0]]===a[1]) delete gh.obs[a[0]]; else gh.obs[a[0]]=a[1];
  }else if(e.target.closest("[data-ghmix]")) gh.mix=!gh.mix;
  else if(e.target.closest("[data-ghkake]")) gh.kake=!gh.kake;
  else return;
  syncEntry(); renderEntry();
}
function syncEntry(){
  var g=document.getElementById("gIn"), g2=document.getElementById("g2In"), mo=document.getElementById("memoIn");
  if(g) pending.g=g.value.trim();
  if(g2) pending.g2=g2.value.trim();
  if(mo) pending.memo=mo.value;
  var ex=viewEl.querySelectorAll("[data-ex]"),i;
  for(i=0;i<ex.length;i++) pending.extra[ex[i].dataset.ex]=ex[i].value;
}

function renderData(){
  hdrEl.innerHTML='<button class="back" data-go="home">← 戻る</button><h1>データ</h1>';
  viewEl.innerHTML='<section class="sec">'
    + '<div class="sechead">BACKUP</div>'
    + '<div class="note" style="padding:0 0 4px">記録はこの端末にだけ残ります。1週間開かないとSafariが保存領域を消すことがあります。</div>'
    + (function(){
        var d=daysSinceExport();
        var t=(d===null)?"まだ書き出していません":("最終書き出し："+(d===0?"今日":d+"日前"));
        return '<div class="lastexp'+((d===null||d>=7)?" warn":"")+'">'+t+'</div>';
      })()
    + '<div class="field"><button class="btn" id="expJson" style="width:100%;padding:11px">JSONで書き出す（復元用）</button></div>'
    + '<div class="field"><button class="btn" id="expCsv" style="width:100%;padding:11px">CSVで書き出す（表計算用）</button></div>'
    + '<div class="field"><button class="btn" id="impBtn" style="width:100%;padding:11px">JSONを読み込む</button>'
    +   '<input type="file" id="impFile" accept=".json,application/json" hidden></div>'
    + '<div class="sechead" style="margin-top:22px">MACHINES</div>'
    + (data.machines.length?data.machines.map(function(m){
        return '<button class="row" data-machine="'+esc(m.id)+'"><div class="t"><b>'+esc(m.name)+'</b>'
          + '<span>契機'+((m.triggers||[]).length)+' / 項目'+((m.fields||[]).length)+'</span></div></button>';
      }).join(""):'<div class="note" style="padding:0">まだ機種がありません。</div>')
    + '</section>';
  removeFab();

  document.getElementById("expJson").addEventListener("click",function(){ exportJson(); renderData(); });
  document.getElementById("expCsv").addEventListener("click",function(){
    var lines=["日付,店,機種,台番号,設定,No,当選G数,ゾーン判定G数,ゾーン当選,当選種別,結果,契機,AT,メモ"];
    data.sessions.forEach(function(s){
      (s.rows||[]).forEach(function(x,i){
        lines.push([s.date,q(s.hall),q(s.machineName),q(s.dai),q(setteiLabel(s)),i+1,(+x.g||0),(x.g2==null||x.g2==="")?"":(+x.g2),zoneCounted(findMachine(s.machineId),x)?"1":"",q(x.kind),q(x.result),q(x.trigger),reachedAt(findMachine(s.machineId),x)?"1":"",q(x.memo)].join(","));
      });
    });
    dl("\ufeff"+lines.join("\r\n"),"text/csv","tousen-rireki-"+today()+".csv");
  });
  document.getElementById("impBtn").addEventListener("click",function(){ document.getElementById("impFile").click(); });
  document.getElementById("impFile").addEventListener("change",function(e){
    var f=e.target.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var j=JSON.parse(fr.result);
        if(!j||!Array.isArray(j.sessions)) throw new Error("bad");
        if(!confirm("読み込むと現在の記録は置き換わります。続けますか？")) return;
        data=j; if(!Array.isArray(data.machines)) data.machines=[];
        save(); go({name:"home"}); toast("読み込みました");
      }catch(err){ toast("読み込めませんでした"); }
    };
    fr.readAsText(f); e.target.value="";
  });
}
function q(s){ s=String(s==null?"":s); return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function dl(text,type,name){
  var blob=new Blob([text],{type:type});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
  toast("書き出しました");
}
function removeFab(){ var f=document.getElementById("fab"); if(f) f.remove(); }

/* ---------- 共通イベント ---------- */
document.addEventListener("click",function(e){
  if(e.target.closest("[data-expnow]")){ exportJson(); render(); return; }
  if(view.name==="machine"){
    var mm=findMachine(view.id), d;
    if(mm){
      if((d=e.target.closest("[data-togglezone]"))){
        var tn=d.dataset.togglezone, zl=zoneTriggersOf(mm).slice(), ix=zl.indexOf(tn);
        if(ix>=0) zl.splice(ix,1); else zl.push(tn);
        mm.zoneTriggers=zl; save(); renderMachine(); return;
      }
      if(e.target.closest("[data-ghtoggle]")){
        mm.analyzer=ghOn(mm)?"off":"ghoul"; save(); renderMachine(); return;
      }
      if(e.target.closest("[data-dual]")){
        mm.dualG=!mm.dualG;
        if(mm.dualG && !mm.gLabels) mm.gLabels={main:"実ゲーム数",zone:"液晶ゲーム数"};
        save(); renderMachine(); return;
      }
      if((d=e.target.closest("[data-toggleat]"))){
        mm.kinds=kindsOf(mm); var ki=+d.dataset.toggleat;
        mm.kinds[ki].at=!mm.kinds[ki].at; save(); renderMachine(); return;
      }
      if((d=e.target.closest("[data-delknd]"))){ mm.kinds=kindsOf(mm); mm.kinds.splice(+d.dataset.delknd,1); save(); renderMachine(); return; }
      if(e.target.closest("[data-addknd]")){
        var kn=prompt("当選種別の名前（例：レミニセンス）");
        if(kn&&kn.trim()){
          var kat=confirm("これはAT・上位当選として扱いますか？");
          mm.kinds=kindsOf(mm); mm.kinds.push({name:kn.trim(),at:kat}); save(); renderMachine();
        }
        return;
      }
      if((d=e.target.closest("[data-deltri]"))){ mm.triggers.splice(+d.dataset.deltri,1); save(); renderMachine(); return; }
      if((d=e.target.closest("[data-delfld]"))){ mm.fields.splice(+d.dataset.delfld,1); save(); renderMachine(); return; }
      if(e.target.closest("[data-addtri]")){
        var t=prompt("契機の名前");
        if(t&&t.trim()){ (mm.triggers=mm.triggers||[]).push(t.trim()); save(); renderMachine(); }
        return;
      }
      if(e.target.closest("[data-addfld]")){
        var f=prompt("項目名（例：穢れ回数）");
        if(f&&f.trim()){ (mm.fields=mm.fields||[]).push({key:uid("f"),label:f.trim()}); save(); renderMachine(); }
        return;
      }
    }
  }
  var b=e.target.closest("[data-go]");
  if(b){
    var t=b.dataset.go;
    if(t==="home") return go({name:"home"});
    if(t==="data") return go({name:"data"});
    if(t==="session") return go({name:"session",id:view.id});
    if(t==="back") return go(view.from||{name:"home"});
    if(t==="data") return go({name:"data"});
    return go({name:t});
  }
  var mb=e.target.closest("[data-machine]");
  if(mb) return go({name:"machine",id:mb.dataset.machine,from:JSON.parse(JSON.stringify(view))});
  var sb=e.target.closest("[data-session]");
  if(sb) return go({name:"session",id:sb.dataset.session});
  var mb=e.target.closest("[data-memo]");
  if(mb && view.name==="session"){
    var sm2=findSession(view.id);
    if(sm2){
      var act=mb.dataset.memo;
      if(act==="edit"){ view.memoEdit=true; renderSession(); }
      else if(act==="cancel"){ view.memoEdit=false; renderSession(); }
      else if(act==="save"){
        var ta=document.getElementById("sMemo");
        if(ta) sm2.memo=ta.value;
        view.memoEdit=false; save(); renderSession(); toast("メモを保存しました");
      }
    }
    return;
  }
  var esb=e.target.closest("[data-editsession]");
  if(esb && view.name==="session") return go({name:"editsession",id:view.id});
  var gs=e.target.closest("[data-ghstart]");
  if(gs && view.name==="session"){
    var sg=findSession(view.id);
    if(sg){ sg.ghStart=gs.dataset.ghstart; save(); renderSession(); }
    return;
  }
  var pk=e.target.closest("[data-pick]");
  if(pk && view.name==="session"){
    var sx=findSession(view.id);
    if(sx){
      if(!Array.isArray(sx.probPick)) sx.probPick=["__at"];
      var key=pk.dataset.pick, ix=sx.probPick.indexOf(key);
      if(ix>=0) sx.probPick.splice(ix,1); else sx.probPick.push(key);
      save(); renderSession();
    }
    return;
  }
  var eb=e.target.closest("[data-edit]");
  if(eb && view.name==="session") return go({name:"entry",id:view.id,row:+eb.dataset.edit});
  var db=e.target.closest("[data-delsession]");
  if(db && view.name==="session"){
    if(!confirm("このセッションを削除します。元に戻せません。")) return;
    data.sessions=data.sessions.filter(function(s){ return s.id!==view.id; });
    save(); go({name:"home"});
  }
});

render();
})();
</script>
</body>
</html>
