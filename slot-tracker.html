<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Slot Tracker">
<title>Slot Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0D0D0D;
    color: #E8E8E8;
    font-family: -apple-system, 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: env(safe-area-inset-bottom);
  }
  input, button { font-family: inherit; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

  /* glow bg */
  .glow1 { position:fixed;top:-100px;right:-100px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,107,53,0.12) 0%,transparent 70%);pointer-events:none;z-index:0; }
  .glow2 { position:fixed;bottom:-80px;left:-80px;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,rgba(123,47,255,0.10) 0%,transparent 70%);pointer-events:none;z-index:0; }

  /* header */
  #header {
    position: sticky; top: 0; z-index: 100;
    padding: 48px 20px 12px;
    border-bottom: 1px solid #222;
    background: rgba(13,13,13,0.95);
    backdrop-filter: blur(10px);
    display: flex; align-items: center; gap: 12px;
  }
  #header .back-btn {
    background: none; border: none; color: #FF6B35;
    font-size: 22px; cursor: pointer; padding: 0 4px; line-height: 1;
  }
  #header .titles { flex: 1; }
  #header .subtitle { font-size: 11px; color: #666; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 2px; }
  #header .title { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  #header .count { font-size: 12px; color: #555; flex-shrink: 0; }
  #sort-btn {
    background: #1a1a1a; border: 1px solid #2a2a2a;
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
    color: #555; font-size: 12px; font-weight: 600;
    display: flex; align-items: center; gap: 4px;
  }
  #sort-btn.active { background: rgba(255,215,0,0.15); border-color: rgba(255,215,0,0.4); color: #FFD700; }

  /* content */
  #content { padding: 16px 20px 120px; position: relative; z-index: 1; }

  /* machine card */
  .machine-card {
    background: #161616; border: 1px solid #242424;
    border-radius: 12px; padding: 12px 14px;
    display: flex; align-items: center; margin-bottom: 10px;
    cursor: pointer; border-left-width: 4px;
    transition: background 0.15s;
  }
  .machine-card:active { background: #1e1e1e; }
  .machine-card .name { font-weight: 600; font-size: 15px; margin-bottom: 3px; }
  .machine-card .sub  { font-size: 12px; color: #555; }
  .machine-card .arrow { color: #444; font-size: 18px; margin-left: 4px; }

  /* star btn */
  .star-btn { background:none;border:none;cursor:pointer;padding:2px 4px;font-size:20px;line-height:1;color:#333;transition:color 0.15s; }
  .star-btn.active { color: #FFD700; }

  /* section divider */
  .divider { font-size:11px;color:#555;letter-spacing:0.1em;margin:12px 0 8px;border-top:1px solid #1e1e1e;padding-top:10px; }
  .fav-label { font-size:11px;color:#FFD700;letter-spacing:0.1em;margin-bottom:8px;opacity:0.7; }

  /* target card */
  .target-card {
    background: #161616; border: 1px solid #242424;
    border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
  }
  .target-header { display:flex;align-items:flex-start;gap:8px;margin-bottom:10px; }
  .target-label  { font-weight:600;font-size:14px;flex:1;line-height:1.4; }
  .del-btn { background:none;border:none;color:#444;font-size:18px;cursor:pointer;line-height:1;padding:0; }

  .type-badge { font-size:10px;padding:2px 8px;border-radius:20px;letter-spacing:0.05em;flex-shrink:0; }

  .sub-row-display {
    display:flex;align-items:center;gap:8px;
    background:#1a1a1a;border-radius:8px;padding:7px 10px;margin-bottom:5px;
  }
  .sub-row-display .sub-name { font-size:12px;color:#aaa;flex:1; }

  .val-badge { background:#1e1e1e;border:1px solid #2a2a2a;border-radius:6px;padding:3px 9px;font-size:13px;color:#ccc;font-weight:600; }

  .note-area { font-size:12px;color:#444;cursor:pointer;padding:2px 0;font-style:italic; }
  .note-area.has-note { color:#888;font-style:normal; }

  /* note edit */
  .note-edit { display:flex;gap:6px; }
  .note-edit input { flex:1;background:#1e1e1e;border:1px solid #FF6B35;border-radius:6px;padding:6px 10px;color:#e8e8e8;font-size:13px;outline:none; }
  .note-edit button { background:#FF6B35;border:none;border-radius:6px;color:#fff;padding:6px 12px;font-size:13px;cursor:pointer; }

  /* form */
  .form-label { margin-bottom:8px;font-size:13px;color:#666;display:block; }
  .form-section { margin-bottom:16px; }
  .form-input {
    width:100%;background:#161616;border:1px solid #333;border-radius:10px;
    padding:12px 16px;color:#e8e8e8;font-size:15px;outline:none;
  }
  .form-input-sm {
    background:#1a1a1a;border:1px solid #333;border-radius:8px;
    padding:8px 10px;color:#e8e8e8;font-size:13px;outline:none;
  }

  /* type selector */
  .type-btns { display:flex;gap:8px; }
  .type-btn {
    flex:1;padding:10px 4px;border-radius:8px;cursor:pointer;
    border:1px solid #2a2a2a;background:#161616;color:#666;
    font-size:12px;font-weight:600;
  }

  /* sub item box */
  .sub-box { background:#161616;border:1px solid #2a2a2a;border-radius:10px;padding:10px 12px;margin-bottom:10px; }
  .sub-box-header { display:flex;gap:6px;align-items:center;margin-bottom:8px; }
  .sub-name-input { flex:1; }
  .val-wrap { display:flex;align-items:center;background:#1a1a1a;border:1px solid #333;border-radius:8px;overflow:hidden;flex-shrink:0; }
  .val-wrap input { width:58px;background:none;border:none;padding:8px 4px 8px 10px;color:#e8e8e8;font-size:13px;outline:none;text-align:center; }
  .val-wrap .unit { font-size:12px;color:#666;padding-right:8px; }
  .del-sub-btn { background:none;border:none;color:#555;font-size:18px;cursor:pointer;line-height:1;padding:0;flex-shrink:0; }

  /* unit toggle */
  .unit-toggle { display:flex;gap:6px;margin-bottom:8px; }
  .unit-chip {
    background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;
    padding:3px 12px;color:#555;font-size:12px;cursor:pointer;
  }
  .unit-chip.active { background:rgba(255,215,0,0.15);border-color:rgba(255,215,0,0.4);color:#FFD700; }

  /* presets */
  .preset-chips { display:flex;gap:6px;flex-wrap:wrap; }
  .preset-chip {
    background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;
    padding:3px 10px;color:#555;font-size:11px;cursor:pointer;
  }
  .preset-chip.active { background:rgba(255,215,0,0.15);border-color:rgba(255,215,0,0.4);color:#FFD700; }

  .add-sub-btn {
    margin-left:auto;border-radius:6px;font-size:12px;font-weight:700;
    padding:5px 12px;cursor:pointer;
  }

  /* G range row */
  .g-range { display:flex;gap:6px;align-items:center; }
  .g-wrap { display:flex;align-items:center;background:#1a1a1a;border:1px solid #333;border-radius:8px;overflow:hidden;flex:1; }
  .g-wrap input { flex:1;background:none;border:none;padding:8px 4px 8px 10px;color:#e8e8e8;font-size:13px;outline:none;min-width:0; }
  .g-wrap .unit { font-size:12px;color:#666;padding-right:8px; }
  .g-sep { color:#444;font-size:13px;flex-shrink:0; }

  /* fab */
  #fab {
    position:fixed;bottom:calc(28px + env(safe-area-inset-bottom));right:24px;
    width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,#FF6B35,#FF3CAC);
    border:none;color:#fff;font-size:28px;cursor:pointer;
    box-shadow:0 4px 20px rgba(255,107,53,0.5);
    display:flex;align-items:center;justify-content:center;z-index:200;
  }
  #fab-add-target {
    position:fixed;bottom:calc(28px + env(safe-area-inset-bottom));right:24px;
    background:linear-gradient(135deg,#FF6B35,#FF3CAC);
    border:none;border-radius:30px;
    padding:14px 24px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;
    box-shadow:0 4px 20px rgba(255,107,53,0.5);z-index:200;
  }

  /* empty state */
  .empty { text-align:center;padding:60px 20px;color:#444;font-size:14px;line-height:1.8; }
  .empty .emoji { font-size:40px;margin-bottom:12px; }

  /* submit btn */
  .submit-btn {
    width:100%;background:#FF6B35;border:none;border-radius:10px;
    padding:14px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;
  }
  .delete-btn {
    background:none;border:1px solid #2a2a2a;color:#555;
    border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;
  }

  .detail-meta { display:flex;align-items:center;margin-bottom:20px;gap:8px; }
  .detail-dot  { width:10px;height:10px;border-radius:50%;flex-shrink:0; }
  .detail-count { flex:1;font-size:13px;color:#555; }
</style>
</head>
<body>
<div class="glow1"></div>
<div class="glow2"></div>
<div id="header">
  <button class="back-btn" id="back-btn" style="display:none">←</button>
  <div class="titles">
    <div class="subtitle">Slot Tracker</div>
    <div class="title" id="header-title">機種一覧</div>
  </div>
  <button id="sort-btn" style="display:none">★ お気に入り</button>
  <span class="count" id="machine-count" style="display:none"></span>
</div>
<div id="content"></div>
<button id="fab" style="display:none">+</button>
<button id="fab-add-target" style="display:none">＋ 狙い目を追加</button>

<script>
const MACHINE_COLORS = ["#FF6B35","#FFD700","#00E5FF","#69FF47","#FF3CAC","#7B2FFF"];
const CEILING_PRESETS = ["通常天井","スルー天井","リセット天井","その他天井"];
const TYPE_META = {
  zone:    { label:"ゾーン狙い", color:"#FF6B35", bg:"rgba(255,107,53,0.15)" },
  ceiling: { label:"天井狙い",   color:"#FFD700", bg:"rgba(255,215,0,0.12)"  },
  custom:  { label:"カスタム",   color:"#A07AFF", bg:"rgba(123,47,255,0.15)" },
};

function uid() { return Math.random().toString(36).substr(2,9); }
function emptyZoneSub()  { return { id:uid(), label:"", startG:"", endG:"" }; }
function emptyCeilSub()  { return { id:uid(), name:"通常天井", val:"", unit:"G", benefit:"", memo:"" }; }
function emptyTarget()   {
  return { type:"zone", label:"", note:"", zoneSubs:[emptyZoneSub()], ceilingSubs:[emptyCeilSub()], startG:"", endG:"" };
}

// unit helper: スルー天井は常に回、それ以外はstored unit
function getUnit(sub) {
  return sub.name === "スルー天井" ? "回" : (sub.unit || "G");
}

// ── State ────────────────────────────────────────────
let machines   = JSON.parse(localStorage.getItem("slot-tracker") || "[]");
let selectedId = null;
let view       = "list"; // list | detail | add-machine | add-target
let sortByFav  = false;
let newTarget  = emptyTarget();
let editingNoteId = null;

function save() {
  localStorage.setItem("slot-tracker", JSON.stringify(machines));
}

function sortMachines(list) {
  const sorted = [...list].sort((a,b) => a.name.localeCompare(b.name,"ja"));
  if (!sortByFav) return sorted;
  return [...sorted.filter(m=>m.fav), ...sorted.filter(m=>!m.fav)];
}

// ── Render helpers ───────────────────────────────────
function el(tag, attrs={}, ...children) {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return e;
}
function div(attrs={}, ...children) { return el("div",attrs,...children); }
function btn(attrs={}, ...children) { return el("button",attrs,...children); }
function inp(attrs={}) { return el("input",attrs); }
function span(attrs={}, ...children) { return el("span",attrs,...children); }

function typeBadge(type) {
  const m = TYPE_META[type]||TYPE_META.custom;
  return span({"class":"type-badge", style:`background:${m.bg};color:${m.color}`}, m.label);
}
function valBadge(text) { return span({"class":"val-badge"}, text); }
function starBtn(fav, onclick) {
  const b = btn({"class":"star-btn"+(fav?" active":"")}, "★");
  b.onclick = onclick;
  return b;
}

// ── Views ────────────────────────────────────────────
function renderList() {
  const c = document.getElementById("content");
  c.innerHTML = "";
  const list = sortMachines(machines);
  const hasFav = machines.some(m=>m.fav);

  if (machines.length === 0) {
    c.appendChild(div({"class":"empty"},
      div({"class":"emoji"}, "🎰"),
      document.createTextNode("機種がまだありません\n下のボタンから追加してみましょう")
    ));
    return;
  }

  if (sortByFav && hasFav) {
    c.appendChild(div({"class":"fav-label"}, "★ お気に入り"));
  }

  list.forEach((m, i) => {
    // divider between fav/non-fav
    if (sortByFav && hasFav && !m.fav && (i===0||list[i-1].fav)) {
      c.appendChild(div({"class":"divider"}, "五十音順"));
    }
    const card = div({"class":"machine-card", style:`border-left-color:${m.color}`});
    const info = div({});
    info.appendChild(div({"class":"name"}, m.name));
    info.appendChild(div({"class":"sub"}, m.targets.length>0 ? `狙い目 ${m.targets.length}件` : "狙い目未設定"));
    card.appendChild(info);
    card.appendChild(starBtn(m.fav, e => {
      e.stopPropagation();
      m.fav = !m.fav; save(); render();
    }));
    card.appendChild(span({"class":"arrow"}, "›"));
    card.onclick = () => { selectedId = m.id; view = "detail"; editingNoteId = null; render(); };
    c.appendChild(card);
  });
}

function renderDetail() {
  const machine = machines.find(m=>m.id===selectedId);
  if (!machine) { view="list"; render(); return; }
  const c = document.getElementById("content");
  c.innerHTML = "";

  const meta = div({"class":"detail-meta"});
  meta.appendChild(div({"class":"detail-dot", style:`background:${machine.color}`}));
  meta.appendChild(div({"class":"detail-count"}, `${machine.targets.length}件の狙い目`));
  meta.appendChild(starBtn(machine.fav, ()=>{ machine.fav=!machine.fav; save(); render(); }));
  const delBtn = btn({"class":"delete-btn"}, "削除");
  delBtn.onclick = () => {
    if (!confirm(`「${machine.name}」を削除しますか？`)) return;
    machines = machines.filter(m=>m.id!==selectedId);
    save(); view="list"; render();
  };
  meta.appendChild(delBtn);
  c.appendChild(meta);

  if (machine.targets.length === 0) {
    c.appendChild(div({"class":"empty", style:"padding:40px 20px"}, "狙い目がまだありません"));
  }

  machine.targets.forEach(t => {
    const card = div({"class":"target-card"});

    // header
    const hdr = div({"class":"target-header"});
    hdr.appendChild(typeBadge(t.type));
    hdr.appendChild(span({"class":"target-label"}, t.label));
    const db = btn({"class":"del-btn"}, "×");
    db.onclick = () => {
      machine.targets = machine.targets.filter(x=>x.id!==t.id);
      save(); render();
    };
    hdr.appendChild(db);
    card.appendChild(hdr);

    // zone subs
    if (t.type==="zone" && t.zoneSubs?.length) {
      t.zoneSubs.forEach(s => {
        const row = div({"class":"sub-row-display"});
        if (s.label) row.appendChild(span({"class":"sub-name"}, s.label));
        else row.appendChild(span({"class":"sub-name"}));
        if (s.startG||s.endG) {
          const gr = div({style:"display:flex;gap:5px;align-items:center"});
          if (s.startG) gr.appendChild(valBadge(s.startG+"G"));
          if (s.startG&&s.endG) gr.appendChild(span({style:"color:#444;font-size:11px"},"〜"));
          if (s.endG) gr.appendChild(valBadge(s.endG+"G"));
          row.appendChild(gr);
        }
        card.appendChild(row);
      });
    }

    // ceiling subs
    if (t.type==="ceiling" && t.ceilingSubs?.length) {
      t.ceilingSubs.forEach(s => {
        const row = div({"class":"sub-row-display", style:"flex-direction:column;align-items:flex-start;gap:4px"});
        const rowTop = div({style:"display:flex;align-items:center;gap:8px;width:100%"});
        rowTop.appendChild(span({"class":"sub-name"}, s.name||"—"));
        if (s.val) rowTop.appendChild(valBadge(s.val + getUnit(s)));
        row.appendChild(rowTop);
        if (s.benefit) row.appendChild(span({style:"font-size:11px;color:#666;padding-left:2px"}, "恩恵："+s.benefit));
        if (s.memo) row.appendChild(span({style:"font-size:11px;color:#555;padding-left:2px"}, "メモ："+s.memo));
        card.appendChild(row);
      });
    }

    // custom range
    if (t.type==="custom" && (t.startG||t.endG)) {
      const gr = div({style:"display:flex;gap:6px;align-items:center;margin-bottom:8px"});
      if (t.startG) gr.appendChild(valBadge(t.startG+"G"));
      if (t.startG&&t.endG) gr.appendChild(span({style:"color:#444;font-size:12px"},"〜"));
      if (t.endG) gr.appendChild(valBadge(t.endG+"G"));
      card.appendChild(gr);
    }

    // note
    if (editingNoteId===t.id) {
      const wrap = div({"class":"note-edit"});
      const ni = inp({type:"text", value:t.note||""});
      ni.style.cssText="flex:1;background:#1e1e1e;border:1px solid #FF6B35;border-radius:6px;padding:6px 10px;color:#e8e8e8;font-size:13px;outline:none;";
      const sb = btn({style:"background:#FF6B35;border:none;border-radius:6px;color:#fff;padding:6px 12px;font-size:13px;cursor:pointer;"},  "保存");
      sb.onclick = () => { t.note=ni.value; save(); editingNoteId=null; render(); };
      ni.addEventListener("keydown", e=>{ if(e.key==="Enter") sb.click(); });
      wrap.appendChild(ni); wrap.appendChild(sb);
      card.appendChild(wrap);
      setTimeout(()=>ni.focus(),50);
    } else {
      const na = div({"class":"note-area"+(t.note?" has-note":"")}, t.note||"＋ メモを追加");
      na.onclick = () => { editingNoteId=t.id; render(); };
      card.appendChild(na);
    }

    c.appendChild(card);
  });
}

function renderAddMachine() {
  const c = document.getElementById("content");
  c.innerHTML = "";
  const wrap = div({style:"padding-top:8px"});
  wrap.appendChild(el("label",{"class":"form-label"},"機種名"));
  const ni = inp({"class":"form-input", type:"text", placeholder:"例：バジリスク絆2"});
  ni.style.marginBottom="16px";
  const submitBtn = btn({"class":"submit-btn"}, "追加する");
  submitBtn.onclick = () => {
    if (!ni.value.trim()) return;
    const m = { id:uid(), name:ni.value.trim(), targets:[], fav:false, color:MACHINE_COLORS[machines.length%MACHINE_COLORS.length] };
    machines.push(m); save();
    selectedId=m.id; view="detail"; render();
  };
  ni.addEventListener("keydown", e=>{ if(e.key==="Enter") submitBtn.click(); });
  wrap.appendChild(ni);
  wrap.appendChild(submitBtn);
  c.appendChild(wrap);
  setTimeout(()=>ni.focus(),50);
}

function renderAddTarget() {
  const c = document.getElementById("content");
  c.innerHTML = "";
  const wrap = div({style:"padding-top:8px"});

  // ── type selector ──
  const typeSec = div({"class":"form-section"});
  typeSec.appendChild(el("label",{"class":"form-label"},"種別"));
  const typeBtns = div({"class":"type-btns"});
  Object.entries(TYPE_META).forEach(([val,meta]) => {
    const b = btn({"class":"type-btn"+(newTarget.type===val?" active":"")}, meta.label);
    if (newTarget.type===val) { b.style.border=`2px solid ${meta.color}`; b.style.background=meta.bg; b.style.color=meta.color; }
    b.onclick = () => { newTarget.type=val; renderAddTarget(); };
    typeBtns.appendChild(b);
  });
  typeSec.appendChild(typeBtns);
  wrap.appendChild(typeSec);

  // ── label ──
  const labelSec = div({"class":"form-section"});
  labelSec.appendChild(el("label",{"class":"form-label"},"ラベル名"));
  const li = inp({"class":"form-input", type:"text",
    placeholder: newTarget.type==="zone"?"例：ゾーン狙い": newTarget.type==="ceiling"?"例：天井狙い":"例：狙い目",
    value: newTarget.label
  });
  li.oninput = e => { newTarget.label=e.target.value; };
  labelSec.appendChild(li);
  wrap.appendChild(labelSec);

  // ── ZONE subs ──
  if (newTarget.type==="zone") {
    const sec = div({"class":"form-section"});
    const hdr = div({style:"display:flex;align-items:center;margin-bottom:10px"});
    hdr.appendChild(span({style:"font-size:13px;color:#666"},"ゾーン"));
    const addBtn = btn({"class":"add-sub-btn", style:"background:rgba(255,107,53,0.1);border:1px solid rgba(255,107,53,0.3);color:#FF6B35"}, "＋ 追加");
    addBtn.onclick = () => { newTarget.zoneSubs.push(emptyZoneSub()); renderAddTarget(); };
    hdr.appendChild(addBtn);
    sec.appendChild(hdr);

    newTarget.zoneSubs.forEach((s,i) => {
      const box = div({"class":"sub-box"});
      // label row
      const lrow = div({"class":"sub-box-header"});
      const sni = inp({"class":"form-input-sm sub-name-input", type:"text", placeholder:"ゾーン名（省略可）", value:s.label});
      sni.oninput = e => s.label=e.target.value;
      lrow.appendChild(sni);
      if (newTarget.zoneSubs.length>1) {
        const db = btn({"class":"del-sub-btn"}, "×");
        db.onclick = () => { newTarget.zoneSubs.splice(i,1); renderAddTarget(); };
        lrow.appendChild(db);
      }
      box.appendChild(lrow);
      // G range
      const gr = div({"class":"g-range"});
      const sw = div({"class":"g-wrap"});
      const si = inp({type:"number", placeholder:"開始G", value:s.startG, style:"flex:1;background:none;border:none;padding:8px 4px 8px 10px;color:#e8e8e8;font-size:13px;outline:none;min-width:0"});
      si.oninput = e => s.startG=e.target.value;
      sw.appendChild(si); sw.appendChild(span({"class":"unit"},"G"));
      const sep = span({"class":"g-sep"},"〜");
      const ew = div({"class":"g-wrap"});
      const ei = inp({type:"number", placeholder:"終了G", value:s.endG, style:"flex:1;background:none;border:none;padding:8px 4px 8px 10px;color:#e8e8e8;font-size:13px;outline:none;min-width:0"});
      ei.oninput = e => s.endG=e.target.value;
      ew.appendChild(ei); ew.appendChild(span({"class":"unit"},"G"));
      gr.appendChild(sw); gr.appendChild(sep); gr.appendChild(ew);
      box.appendChild(gr);
      sec.appendChild(box);
    });
    wrap.appendChild(sec);
  }

  // ── CEILING subs ──
  if (newTarget.type==="ceiling") {
    const sec = div({"class":"form-section"});
    const hdr = div({style:"display:flex;align-items:center;margin-bottom:10px"});
    hdr.appendChild(span({style:"font-size:13px;color:#666"},"天井の種類"));
    const addBtn = btn({"class":"add-sub-btn", style:"background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.3);color:#FFD700"}, "＋ 追加");
    addBtn.onclick = () => { newTarget.ceilingSubs.push(emptyCeilSub()); renderAddTarget(); };
    hdr.appendChild(addBtn);
    sec.appendChild(hdr);

    newTarget.ceilingSubs.forEach((s,i) => {
      const isSlur = s.name==="スルー天井";
      const currentUnit = getUnit(s);
      const box = div({"class":"sub-box"});

      // name + val row
      const nrow = div({"class":"sub-box-header"});
      const sni = inp({"class":"form-input-sm sub-name-input", type:"text", placeholder:"天井名", value:s.name});
      sni.oninput = e => { s.name=e.target.value; };
      sni.onblur = () => renderAddTarget();
      nrow.appendChild(sni);
      const vw = div({"class":"val-wrap"});
      const vi = inp({type:"number", placeholder:"数値", value:s.val, style:"width:58px;background:none;border:none;padding:8px 4px 8px 10px;color:#e8e8e8;font-size:13px;outline:none;text-align:center"});
      vi.oninput = e => s.val=e.target.value;
      vw.appendChild(vi);
      vw.appendChild(span({"class":"unit"}, currentUnit));
      nrow.appendChild(vw);
      if (newTarget.ceilingSubs.length>1) {
        const db = btn({"class":"del-sub-btn"}, "×");
        db.onclick = () => { newTarget.ceilingSubs.splice(i,1); renderAddTarget(); };
        nrow.appendChild(db);
      }
      box.appendChild(nrow);

      // unit toggle (スルー天井以外のみ)
      if (!isSlur) {
        const ut = div({"class":"unit-toggle"});
        ["G","周期"].forEach(u => {
          const uc = btn({"class":"unit-chip"+(s.unit===u?" active":"")}, u);
          uc.onclick = () => { s.unit=u; renderAddTarget(); };
          ut.appendChild(uc);
        });
        box.appendChild(ut);
      }

      // preset chips
      const pc = div({"class":"preset-chips"});
      CEILING_PRESETS.forEach(p => {
        const chip = btn({"class":"preset-chip"+(s.name===p?" active":"")}, p);
        chip.onclick = () => { s.name=p; if(p==="スルー天井") s.unit="回"; renderAddTarget(); };
        pc.appendChild(chip);
      });
      box.appendChild(pc);

      // 恩恵入力
      const benefitRow = div({style:"margin-top:8px"});
      const bi = inp({"class":"form-input-sm", type:"text", placeholder:"恩恵（省略可）", value:s.benefit||"", style:"width:100%"});
      bi.oninput = e => s.benefit=e.target.value;
      benefitRow.appendChild(bi);
      box.appendChild(benefitRow);

      // メモ入力
      const memoRow = div({style:"margin-top:6px"});
      const mi = inp({"class":"form-input-sm", type:"text", placeholder:"メモ（省略可）", value:s.memo||"", style:"width:100%"});
      mi.oninput = e => s.memo=e.target.value;
      memoRow.appendChild(mi);
      box.appendChild(memoRow);

      sec.appendChild(box);
    });
    wrap.appendChild(sec);
  }

  // ── CUSTOM range ──
  if (newTarget.type==="custom") {
    const sec = div({"class":"form-section"});
    sec.appendChild(el("label",{"class":"form-label"},"ゲーム数（省略可）"));
    const gr = div({"class":"g-range"});
    const sw = div({"class":"g-wrap"});
    const si = inp({type:"number", placeholder:"開始G", value:newTarget.startG, style:"flex:1;background:none;border:none;padding:8px 4px 8px 10px;color:#e8e8e8;font-size:13px;outline:none;min-width:0"});
    si.oninput=e=>newTarget.startG=e.target.value;
    sw.appendChild(si); sw.appendChild(span({"class":"unit"},"G"));
    const ew = div({"class":"g-wrap"});
    const ei = inp({type:"number", placeholder:"終了G", value:newTarget.endG, style:"flex:1;background:none;border:none;padding:8px 4px 8px 10px;color:#e8e8e8;font-size:13px;outline:none;min-width:0"});
    ei.oninput=e=>newTarget.endG=e.target.value;
    ew.appendChild(ei); ew.appendChild(span({"class":"unit"},"G"));
    gr.appendChild(sw); gr.appendChild(span({"class":"g-sep"},"〜")); gr.appendChild(ew);
    sec.appendChild(gr);
    wrap.appendChild(sec);
  }

  // ── note ──
  const noteSec = div({"class":"form-section", style:"margin-bottom:24px"});
  noteSec.appendChild(el("label",{"class":"form-label"},"メモ（省略可）"));
  const ni2 = inp({"class":"form-input", type:"text", placeholder:"例：前兆中はステージで判別", value:newTarget.note});
  ni2.oninput=e=>newTarget.note=e.target.value;
  noteSec.appendChild(ni2);
  wrap.appendChild(noteSec);

  // ── submit ──
  const sb = btn({"class":"submit-btn"}, "追加する");
  sb.onclick = () => {
    if (!newTarget.label.trim()) return;
    const machine = machines.find(m=>m.id===selectedId);
    if (!machine) return;
    machine.targets.push({ id:uid(), ...JSON.parse(JSON.stringify(newTarget)) });
    save(); newTarget=emptyTarget(); view="detail"; render();
  };
  wrap.appendChild(sb);
  c.appendChild(wrap);
}

// ── Header & FAB update ──────────────────────────────
function updateChrome() {
  const titles = { list:"機種一覧", detail: machines.find(m=>m.id===selectedId)?.name||"", "add-machine":"機種を追加", "add-target":"狙い目を追加" };
  document.getElementById("header-title").textContent = titles[view]||"";

  const backBtn   = document.getElementById("back-btn");
  const sortBtn   = document.getElementById("sort-btn");
  const countEl   = document.getElementById("machine-count");
  const fab       = document.getElementById("fab");
  const fabTarget = document.getElementById("fab-add-target");

  backBtn.style.display   = view!=="list" ? "" : "none";
  sortBtn.style.display   = view==="list" ? "" : "none";
  countEl.style.display   = view==="list" ? "" : "none";
  fab.style.display       = view==="list" ? "" : "none";
  fabTarget.style.display = view==="detail" ? "" : "none";

  countEl.textContent = machines.length+"機種";
  sortBtn.className   = "sort-btn"+(sortByFav?" active":"");
  sortBtn.textContent = (sortByFav?"★ 解除":"★ お気に入り");
}

// ── Main render ──────────────────────────────────────
function render() {
  updateChrome();
  if (view==="list")         renderList();
  else if (view==="detail")  renderDetail();
  else if (view==="add-machine") renderAddMachine();
  else if (view==="add-target")  renderAddTarget();
}

// ── Event listeners ──────────────────────────────────
document.getElementById("back-btn").onclick = () => {
  if (view==="add-machine"||view==="detail") view="list";
  else if (view==="add-target") { newTarget=emptyTarget(); view="detail"; }
  editingNoteId=null; render();
};
document.getElementById("sort-btn").onclick = () => { sortByFav=!sortByFav; render(); };
document.getElementById("fab").onclick = () => { view="add-machine"; render(); };
document.getElementById("fab-add-target").onclick = () => { newTarget=emptyTarget(); view="add-target"; render(); };

render();
</script>
</body>
</html>
